name: MondayID Apple Adapter Proof

on:
  push:
    paths:
      - "platform/apple-adapter/**"
      - "platform/apple-host/**"
      - ".github/workflows/apple-adapter-proof.yml"
  pull_request:
    paths:
      - "platform/apple-adapter/**"
      - "platform/apple-host/**"
      - ".github/workflows/apple-adapter-proof.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apple-adapter:
    name: Compile and launch MondayID iOS host
    runs-on: macos-15
    defaults:
      run:
        working-directory: platform/apple-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build adapter on macOS
        run: swift build -v

      - name: Test command bridge
        run: swift test -v

      - name: Compile adapter for iOS Simulator
        run: xcodebuild -scheme MondayIDAppleAdapter -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Build real iOS host with local adapter package
        run: xcodebuild -project ../apple-host/MondayIDHost.xcodeproj -scheme MondayIDHost -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../apple-host/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Install and launch MondayIDHost in an ephemeral iPhone Simulator
        timeout-minutes: 2
        run: |
          set -euo pipefail
          DEVICE_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $0 !~ /unavailable/ {print $2; exit}')"
          if [ -z "$DEVICE_UDID" ]; then
            RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=json.load(sys.stdin)["runtimes"]; xs=[x for x in r if x.get("isAvailable") and x.get("platform")=="iOS"]; print(xs[-1]["identifier"] if xs else "")')"
            DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; xs=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")]; print(xs[0]["identifier"] if xs else "")')"
            test -n "$RUNTIME_ID"
            test -n "$DEVICE_TYPE_ID"
            DEVICE_UDID="$(xcrun simctl create MondayID-CI "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          fi
          xcrun simctl boot "$DEVICE_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          APP_PATH="../apple-host/DerivedData/Build/Products/Debug-iphonesimulator/MondayIDHost.app"
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          LAUNCH_RESULT="$(xcrun simctl launch "$DEVICE_UDID" com.mondayid.host)"
          echo "$LAUNCH_RESULT"
          APP_CONTAINER="$(xcrun simctl get_app_container "$DEVICE_UDID" com.mondayid.host app)"
          test -d "$APP_CONTAINER"
          echo "MONDAYID_IOS_HOST_LAUNCH_PASS"
