name: MondayID Apple Adapter Proof

on:
  push:
    paths:
      - "platform/apple-adapter/**"
      - "platform/apple-host/**"
      - ".github/workflows/apple-adapter-proof.yml"
  pull_request:
    paths:
      - "platform/apple-adapter/**"
      - "platform/apple-host/**"
      - ".github/workflows/apple-adapter-proof.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apple-adapter:
    name: Compile App Intents adapter and iOS host
    runs-on: macos-15
    defaults:
      run:
        working-directory: platform/apple-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build adapter on macOS
        run: swift build -v

      - name: Test command bridge
        run: swift test -v

      - name: Compile adapter for iOS Simulator
        run: xcodebuild -scheme MondayIDAppleAdapter -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Build real iOS host with local adapter package
        run: xcodebuild -project ../apple-host/MondayIDHost.xcodeproj -scheme MondayIDHost -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
