name: Fresh Chat Phenotype Acceptance

on:
  pull_request:
    paths:
      - "platform/recovery/fresh-chat-phenotype.mjs"
      - "platform/recovery/fresh-chat-phenotype-proof.mjs"
      - ".github/workflows/fresh-chat-phenotype-proof.yml"

permissions:
  contents: read

jobs:
  fresh-chat-phenotype-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run multi-turn phenotype acceptance proof
        run: node platform/recovery/fresh-chat-phenotype-proof.mjs
