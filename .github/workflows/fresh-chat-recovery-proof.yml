name: Fresh Chat Recovery Proof

on:
  pull_request:
    paths:
      - "platform/recovery/fresh-chat-recovery.mjs"
      - "platform/recovery/fresh-chat-recovery-proof.mjs"
      - ".github/workflows/fresh-chat-recovery-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-chat-recovery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run held-out fresh-chat recovery proof
        run: node platform/recovery/fresh-chat-recovery-proof.mjs
