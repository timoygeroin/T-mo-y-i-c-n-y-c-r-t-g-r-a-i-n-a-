name: Browser Organ Canary

on:
  pull_request:
    paths:
      - ".github/workflows/browser-organ-canary.yml"
      - "platform/browser/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser organ runtime
        run: |
          npm install -g agent-browser
          npx agent-browser install

      - name: Exercise real public site
        run: |
          set -euo pipefail
          mkdir -p browser-evidence

          agent-browser open https://avodamarchok.com/
          agent-browser wait --load networkidle
          agent-browser get title > browser-evidence/home-title.txt
          agent-browser get url > browser-evidence/home-url.txt
          agent-browser snapshot -i > browser-evidence/home-snapshot.txt
          agent-browser screenshot browser-evidence/home.png
          agent-browser eval 'JSON.stringify(Array.from(document.querySelectorAll("a")).map(a => ({text:(a.innerText||"").trim(), href:a.href})))' > browser-evidence/home-links.json

          agent-browser find text "עיינו במשימות" click
          agent-browser wait --load networkidle
          agent-browser get title > browser-evidence/tasks-title.txt
          agent-browser get url > browser-evidence/tasks-url.txt
          agent-browser snapshot -i > browser-evidence/tasks-snapshot.txt
          agent-browser screenshot browser-evidence/tasks.png

          agent-browser open https://avodamarchok.com/
          agent-browser wait --load networkidle
          APPLY_URL=$(node -e 'const fs=require("fs"); const raw=fs.readFileSync("browser-evidence/home-links.json","utf8"); const data=JSON.parse(raw); const links=JSON.parse(data.data?.result ?? data.data ?? data); const hit=links.find(x=>x.text.includes("הגישו בקשה")); if(!hit?.href) process.exit(2); process.stdout.write(hit.href);')
          printf '%s\n' "$APPLY_URL" > browser-evidence/apply-target.txt
          agent-browser open "$APPLY_URL"
          agent-browser wait --load networkidle
          agent-browser get title > browser-evidence/apply-title.txt
          agent-browser get url > browser-evidence/apply-url.txt
          agent-browser snapshot -i > browser-evidence/apply-snapshot.txt
          agent-browser screenshot browser-evidence/apply.png

          printf '{"result":"BROWSER_ORGAN_NAVIGATION_PASS","target":"https://avodamarchok.com/","flows":["home","tasks","apply"],"locatorLaw":"semantic->dom_href->snapshot_ref"}\n' > browser-evidence/receipt.json
          agent-browser close

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-organ-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-evidence/
          if-no-files-found: error
