name: Monday Consumer Voice Integration

on:
  push:
    branches:
      - monday/continuum-runtime-integration-20260914
    paths:
      - '.github/workflows/monday-consumer-voice-integration.yml'
      - 'platform/apple-host/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-capture-proof:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persisted voice source postconditions
        run: |
          set -euo pipefail
          f=platform/apple-host/MondayIDHost/MondayIDHostApp.swift
          grep -q 'import AVFoundation' "$f"
          grep -q 'case audio = "Audio"' "$f"
          grep -q 'showingVoiceRecorder = true' "$f"
          grep -q 'struct MondayVoiceRecorder' "$f"
          grep -q 'AVAudioRecorder' "$f"
          test "$(grep -c 'INFOPLIST_KEY_NSMicrophoneUsageDescription' platform/apple-host/MondayIDHost.xcodeproj/project.pbxproj)" -eq 2
      - name: Run Apple adapter tests
        run: swift test --package-path platform/apple-adapter
      - name: Compile iOS Simulator body
        run: |
          set -euo pipefail
          xcodebuild -project platform/apple-host/MondayIDHost.xcodeproj -scheme MondayIDHost -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/monday-voice-regression.log
          grep -q '\*\* BUILD SUCCEEDED \*\*' /tmp/monday-voice-regression.log
