name: ARC-AGI-3 isolated UL004 component-feedback public A-B
on:
  pull_request:
    paths:
      - 'competitions/arc-agi-3/tools/ul004_component_feedback_variant.py'
      - 'competitions/arc-agi-3/tests/test_ul004_component_feedback_candidate.py'
      - '.github/workflows/arc-agent-ul004-component-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze unchanged submission agent and test candidate
        run: |
          set -euo pipefail
          test "$(git hash-object competitions/arc-agi-3/agent/my_agent.py)" = "eb7bd0288cfa794f7997f6a93191c0a0c2c2787c"
          (cd competitions/arc-agi-3 && python -m unittest discover -s tests -p 'test_ul004_component_feedback_candidate.py' -v)
          python -m py_compile competitions/arc-agi-3/tools/ul004_component_feedback_variant.py
      - name: Fetch official public ARC-AGI-3 starter
        run: git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
      - name: Install official Python 3.12 local engine
        working-directory: arc-starter
        run: make setup PYTHON=python3.12
      - name: H0 frozen original 25 public games same 500-step budget
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee arc-ul004-frozen.log
      - name: H1 isolated component feedback 25 public games same 500-step budget
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/ul004_component_feedback_variant.py --source competitions/arc-agi-3/agent/my_agent.py --output arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee arc-ul004-candidate.log
      - name: Compare public scorecard levels actions and regressions without promotion
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py arc-ul004-frozen.log arc-ul004-candidate.log --expected-games 25 --output arc-ul004-comparison.json | tee arc-ul004-summary.log
      - name: Preserve full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-ul004-component-feedback-public-ab
          path: |
            arc-ul004-frozen.log
            arc-ul004-candidate.log
            arc-ul004-comparison.json
            arc-ul004-summary.log
          if-no-files-found: ignore
