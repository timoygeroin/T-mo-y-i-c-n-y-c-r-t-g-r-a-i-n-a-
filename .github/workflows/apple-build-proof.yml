name: MondayID Apple build proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platform/apple-host/**"
      - "platform/apple-adapter/**"
      - ".github/workflows/apple-build-proof.yml"
  pull_request:
    paths:
      - "platform/apple-host/**"
      - "platform/apple-adapter/**"
      - ".github/workflows/apple-build-proof.yml"

permissions:
  contents: read

concurrency:
  group: mondayid-apple-build-proof
  cancel-in-progress: false

jobs:
  apple-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Test Apple runtime adapter
        run: swift test --package-path platform/apple-adapter

      - name: Compile MondayIDHost for iPhone Simulator without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project platform/apple-host/MondayIDHost.xcodeproj \
            -scheme MondayIDHost \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile MondayIDHost for physical iPhone SDK without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project platform/apple-host/MondayIDHost.xcodeproj \
            -scheme MondayIDHost \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath .build/iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned iPhoneOS app for the signing gate
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            .build/iphoneos/Build/Products/Release-iphoneos/MondayIDHost.app \
            mondayid-host-unsigned-iphoneos.zip

      - name: Upload unsigned iPhoneOS build
        uses: actions/upload-artifact@v4
        with:
          name: mondayid-host-unsigned-iphoneos
          path: mondayid-host-unsigned-iphoneos.zip
          if-no-files-found: error
          retention-days: 7

      - name: Record proof boundary
        run: |
          echo "Swift package tests: PASS"
          echo "iPhone Simulator compile: PASS"
          echo "Physical iPhoneOS SDK compile: PASS"
          echo "Unsigned iPhoneOS app artifact: PRODUCED"
          echo "Physical iPhone signing/install/runtime acceptance: NOT PROVEN BY THIS WORKFLOW"
