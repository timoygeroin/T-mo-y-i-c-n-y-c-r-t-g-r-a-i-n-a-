name: ARC-AGI-3 isolated coordinate-novelty same-budget public A-B
on:
  pull_request:
    paths:
      - 'competitions/arc-agi-3/agent/candidate_coordinate_novelty.py'
      - 'competitions/arc-agi-3/tests/test_coordinate_novelty_candidate.py'
      - '.github/workflows/arc-agent-coordinate-novelty-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_ab:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify predeclared coordinate-aware click behavioral gates
        working-directory: competitions/arc-agi-3
        run: |
          python -m unittest discover -s tests -p 'test_coordinate_novelty_candidate.py' -v
          python -m unittest discover -s tests -p 'test_compare_public_logs.py' -v
      - name: Install official public ARC-AGI-3 runner
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
          cd arc-starter && make setup PYTHON=python3.12
      - name: Frozen original 25 public games at 120 actions
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=120) | tee arc-coordinate-baseline120.log
      - name: Isolated H1 candidate same 25 public games at 120 actions
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/candidate_coordinate_novelty.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=120) | tee arc-coordinate-candidate120.log
      - name: Compare frozen and H1 under identical 120-action caps
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py arc-coordinate-baseline120.log arc-coordinate-candidate120.log --output arc-coordinate-ab120.json | tee arc-coordinate-summary120.log
      - name: Frozen original 25 public games at 500 actions
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee arc-coordinate-baseline500.log
      - name: Isolated H1 candidate same 25 public games at 500 actions
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/candidate_coordinate_novelty.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee arc-coordinate-candidate500.log
      - name: Compare frozen and H1 under identical 500-action caps
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py arc-coordinate-baseline500.log arc-coordinate-candidate500.log --output arc-coordinate-ab500.json | tee arc-coordinate-summary500.log
      - name: Report predeclared nine-game public subgroup without tuning
        run: |
          python - <<'PY'
          import json
          games=('su15','bp35','wa30','ft09','sk48','re86','m0r0','s5i5','sb26')
          for cap in (120,500):
              data=json.load(open(f'arc-coordinate-ab{cap}.json'))
              rows=data['per_game']
              print(json.dumps({'cap':cap,'frozen_nine':games,
                  'baseline_levels':sum(rows[g]['baseline_levels'] for g in games),
                  'candidate_levels':sum(rows[g]['candidate_levels'] for g in games),
                  'per_game_delta':{g:rows[g]['level_delta'] for g in games},
                  'status':'PUBLIC_ALREADY_AGGREGATE_BENCHMARKED_NOT_HIDDEN_HOLDOUT'},
                  sort_keys=True))
          PY
      - name: Preserve negative or positive evidence without auto-promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-coordinate-persistence-public-ab
          path: |
            arc-coordinate-baseline120.log
            arc-coordinate-candidate120.log
            arc-coordinate-ab120.json
            arc-coordinate-summary120.log
            arc-coordinate-baseline500.log
            arc-coordinate-candidate500.log
            arc-coordinate-ab500.json
            arc-coordinate-summary500.log
          if-no-files-found: ignore
