name: ARC-AGI-3 isolated frontier public A-B
on:
  pull_request:
    paths:
      - 'competitions/arc-agi-3/agent/candidate_frontier_agent.py'
      - 'competitions/arc-agi-3/tests/test_frontier_candidate.py'
      - 'competitions/arc-agi-3/tools/compare_public_logs.py'
      - 'competitions/arc-agi-3/tests/test_compare_public_logs.py'
      - '.github/workflows/arc-agent-frontier-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated candidate and comparison parser
        working-directory: competitions/arc-agi-3
        run: python -m unittest discover -s tests -p 'test_*candidate.py' -v && python -m unittest discover -s tests -p 'test_compare_public_logs.py' -v
      - name: Fetch official ARC starter
        run: git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
      - name: Install official ARC public environment
        working-directory: arc-starter
        run: make setup PYTHON=python3.12
      - name: Run FROZEN MondayID baseline on 25 public games at 120 actions
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=120) | tee arc-frontier-baseline.log
      - name: Run ISOLATED frontier candidate on same 25 public games and action cap
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/candidate_frontier_agent.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=120) | tee arc-frontier-candidate.log
      - name: Compare local scorecards and per-game regressions without promotion
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py arc-frontier-baseline.log arc-frontier-candidate.log --output arc-frontier-ab-result.json | tee arc-frontier-ab-summary.log
      - name: Preserve read-only evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-frontier-public-ab
          path: |
            arc-frontier-baseline.log
            arc-frontier-candidate.log
            arc-frontier-ab-result.json
            arc-frontier-ab-summary.log
          if-no-files-found: ignore
