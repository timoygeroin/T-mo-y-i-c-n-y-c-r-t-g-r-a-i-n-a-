# Isolated, reversible research only. Never modifies official submission agent.
# Pre-outcome hypotheses:
# H0: frozen novelty policy is no worse on equal 500-action budgets.
# H1: after 96 level-zero click-only actions, quadtree-dispersed targets
#     increase first-level completion / reduce action cost over row-major.
# H2: row-major is better because spatial locality matters.
# Previously observed 25 public games: no unseen held-out or hidden claim.
name: ARC-AGI-3 isolated Morton spatial click public A-B-C
on:
  pull_request:
    paths:
      - '.github/workflows/arc-agent-morton-ab.yml'
      - 'competitions/arc-agi-3/tools/click_morton_variant.py'
      - 'competitions/arc-agi-3/tests/test_click_morton_candidate.py'
permissions:
  contents: read
jobs:
  public_abc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen blob and research candidate contracts before public play
        run: |
          set -euo pipefail
          test "$(git hash-object competitions/arc-agi-3/agent/my_agent.py)" = "eb7bd0288cfa794f7997f6a93191c0a0c2c2787c"
          (cd competitions/arc-agi-3 && python -m unittest discover -s tests -p 'test_click_morton_candidate.py' -v)
          (cd competitions/arc-agi-3 && python -m unittest discover -s tests -p 'test_click_stagnation_candidate.py' -v)
          (cd competitions/arc-agi-3 && python -m unittest discover -s tests -p 'test_compare_public_logs.py' -v)
      - name: Fetch official public starter and Python 3.12 engine
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
          (cd arc-starter && make setup PYTHON=python3.12)
      - name: Build isolated frozen, row-major-96, and Morton-96 policies
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'competitions/arc-agi-3/tools')
          from click_stagnation_variant import generate as row_generate
          from click_morton_variant import generate as morton_generate
          frozen=Path('competitions/arc-agi-3/agent/my_agent.py').read_text()
          row=row_generate(frozen)
          assert row.count('self._steps >= 128') == 1
          row=row.replace('self._steps >= 128', 'self._steps >= 96', 1)
          morton=morton_generate(frozen, threshold=96)
          for name,src in [('frozen',frozen),('row96',row),('morton96',morton)]:
              assert src.count('    MAX_ACTIONS = 500') == 1
              compile(src, f'<{name}>', 'exec')
              Path(f'arc-{name}.py').write_text(src)
          print('PREREGISTERED_H0_H1_H2_GENERATED; frozen policy unmodified')
          PY
      - name: Official public 25-game equal-budget three-arm experiment
        run: |
          set -euo pipefail
          for arm in frozen row96 morton96; do
            cp "arc-$arm.py" arc-starter/agent/my_agent.py
            (cd arc-starter && make play-local STEPS=500) > "arc-$arm.log" 2>&1
            echo "ARM_COMPLETED $arm"
            tail -n 3 "arc-$arm.log"
          done
      - name: Compare public levels, score, action costs, regressions
        run: |
          set -euo pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py arc-frozen.log arc-row96.log --output arc-row96-vs-frozen.json
          python competitions/arc-agi-3/tools/compare_public_logs.py arc-frozen.log arc-morton96.log --output arc-morton96-vs-frozen.json
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0, 'competitions/arc-agi-3/tools')
          from compare_public_logs import parse,compare
          logs={a:Path(f'arc-{a}.log').read_text() for a in ('frozen','row96','morton96')}
          results={a:parse(s) for a,s in logs.items()}
          p=re.compile(r'\b([a-z0-9]{4}) - ACTION\d+: count (\d+), levels completed (\d+)')
          def first_steps(s):
              found={}
              for game,count,level in p.findall(s):
                  if int(level)>0 and game not in found:
                      found[game]=int(count)
              return found
          times={a:first_steps(s) for a,s in logs.items()}
          summary={'schema':'mondayid.arc3.morton_spatial_public_abc.v1',
                   'status':'RESEARCH_ONLY_PREVIOUSLY_USED_PUBLIC_GAMES',
                   'engine':'official ARC-AGI-3 Python 3.12 public starter',
                   'games':25,'configured_action_cap':500,
                   'hypotheses':{'H0':'frozen no worse',
                                 'H1':'Morton-96 improves spatial exploration',
                                 'H2':'row-major-96 is better'},
                   'arms':{},'comparisons':{},
                   'independent_latent_reset_pairing':False,
                   'unseen_held_out':False,'auto_promoted':False}
          for a in results:
              summary['arms'][a]={'first_levels':sum(v['levels'] for v in results[a]['games'].values()),
                                  'local_score':results[a]['local_score'],
                                  'total_reported_actions':sum(v['actions'] for v in results[a]['games'].values()),
                                  'first_level_steps':times[a]}
          for a in ('row96','morton96'):
              diff=compare(results['frozen'],results[a])
              shared=set(times['frozen']) & set(times[a])
              diff['shared_first_level_action_cost_deltas']={g:times[a][g]-times['frozen'][g] for g in sorted(shared)}
              diff['new_first_level_action_costs']={g:times[a][g] for g in sorted(set(times[a])-set(times['frozen']))}
              summary['comparisons'][a]=diff
          summary['comparisons']['morton96_vs_row96']=compare(results['row96'],results['morton96'])
          Path('arc-morton-public-abc.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('PUBLIC_ABC_READBACK',json.dumps({a:(v['first_levels'],v['local_score']) for a,v in summary['arms'].items()}))
          print('MORTON_DELTA',summary['comparisons']['morton96']['local_score_delta'],
                summary['comparisons']['morton96']['improved_games'],
                summary['comparisons']['morton96']['regressed_games'])
          PY
      - name: Preserve raw public evidence and generated isolated candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-morton-spatial-public-abc
          path: |
            arc-frozen.py
            arc-row96.py
            arc-morton96.py
            arc-frozen.log
            arc-row96.log
            arc-morton96.log
            arc-row96-vs-frozen.json
            arc-morton96-vs-frozen.json
            arc-morton-public-abc.json
          if-no-files-found: ignore
