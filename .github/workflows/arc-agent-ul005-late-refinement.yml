name: ARC-AGI-3 UL005 isolated late refinement public A-B-C
on:
  pull_request:
    paths:
      - 'competitions/arc-agi-3/tools/click_late_refinement_variant.py'
      - 'competitions/arc-agi-3/tests/test_click_late_refinement_candidate.py'
      - '.github/workflows/arc-agent-ul005-late-refinement.yml'
permissions:
  contents: read
jobs:
  public_abc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated candidate and public comparison contracts
        working-directory: competitions/arc-agi-3
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_click_late_refinement_candidate.py' -v
          python -m unittest discover -s tests -p 'test_compare_public_logs.py' -v
      - name: Fetch official ARC-AGI-3 public starter
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
          git -C arc-starter rev-parse HEAD | tee ul005-starter-sha.txt
      - name: Install official Python 3.12 offline runner
        working-directory: arc-starter
        run: make setup PYTHON=python3.12
      - name: Frozen original policy 25 public games 500 steps
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee ul005-frozen.log
      - name: Existing stagnation gate threshold 96 25 public games 500 steps
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'competitions/arc-agi-3/tools')
          from click_stagnation_variant import generate
          source=Path('competitions/arc-agi-3/agent/my_agent.py').read_text()
          result=generate(source)
          assert result.count('self._steps >= 128') == 1
          result=result.replace('self._steps >= 128','self._steps >= 96',1)
          compile(result, '<ul005-row96>', 'exec')
          Path('arc-starter/agent/my_agent.py').write_text(result)
          PY
          (cd arc-starter && make play-local STEPS=500) | tee ul005-row96.log
      - name: UL005 late spatial refinement 25 public games 500 steps
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/click_late_refinement_variant.py --source competitions/arc-agi-3/agent/my_agent.py --output arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee ul005-refinement.log
      - name: Compare actual public scorecards and regressions without promotion
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py ul005-frozen.log ul005-row96.log --output ul005-row96-v-frozen.json | tee ul005-row96-summary.log
          python competitions/arc-agi-3/tools/compare_public_logs.py ul005-frozen.log ul005-refinement.log --output ul005-refinement-v-frozen.json | tee ul005-refinement-summary.log
          python competitions/arc-agi-3/tools/compare_public_logs.py ul005-row96.log ul005-refinement.log --output ul005-refinement-v-row96.json | tee ul005-incremental-summary.log
      - name: Preserve full official public evidence, including regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ul005-late-refinement-public-abc
          path: |
            ul005-starter-sha.txt
            ul005-frozen.log
            ul005-row96.log
            ul005-refinement.log
            ul005-row96-v-frozen.json
            ul005-refinement-v-frozen.json
            ul005-refinement-v-row96.json
            ul005-row96-summary.log
            ul005-refinement-summary.log
            ul005-incremental-summary.log
          if-no-files-found: ignore
