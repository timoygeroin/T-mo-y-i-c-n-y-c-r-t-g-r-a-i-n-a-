name: MondayID Production Promotion

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA approved for production
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mondayid-production
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://mondayid-host.vercel.app

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_main_sha || github.sha }}
          fetch-depth: 1

      - name: Bind promotion to exact canonical main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_main_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          actual="$(git rev-parse HEAD)"
          canonical="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_SHA"
          test "$canonical" = "$EXPECTED_SHA"
          echo "Verifying exact main SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove canonical runtime before promotion
        run: npm test

      - name: Wait for Vercel Git promotion and read back exact alias
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_main_sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$PRODUCTION_URL/api/health" -o /tmp/health.json \
              && curl --fail --silent --show-error "$PRODUCTION_URL/api/boot" -o /tmp/boot.json \
              && EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const boot=JSON.parse(fs.readFileSync('/tmp/boot.json','utf8'));
          const expected=process.env.EXPECTED_SHA;
          const pass=
            health.ok === true &&
            health.generation === 5 &&
            health.kernel === 'mondayid-generation-5' &&
            health.sourceRevision === expected &&
            health.authority?.no_spend === true &&
            health.continuity?.trusted_worldline_configured === true &&
            health.continuity?.trusted_writer_configured === true &&
            boot.ok === true &&
            boot.state === 'FULFILLED' &&
            boot.identity?.sourceRevision === expected &&
            boot.worldline?.trust === 'trusted' &&
            Number(boot.worldline?.imported || 0) >= 6;
          if (!pass) process.exit(1);
          console.log(JSON.stringify({
            status:'PASS',
            sourceRevision:expected,
            generation:health.generation,
            boot:boot.state,
            trustedEvents:boot.worldline.imported,
            modelExecution:'disabled-by-default'
          },null,2));
          NODE
            then
              exit 0
            fi
            echo "Production alias has not reached $EXPECTED_SHA yet (attempt $attempt/60)"
            sleep 5
          done
          echo "Timed out waiting for exact Vercel production revision $EXPECTED_SHA" >&2
          cat /tmp/health.json 2>/dev/null || true
          cat /tmp/boot.json 2>/dev/null || true
          exit 1
