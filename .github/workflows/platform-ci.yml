name: Monday Platform CI

on:
  push:
    branches:
      - main
      - monday-platform-genesis-01
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  host:
    name: Host state and browser regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run test:model --workspace @mondayid/host
      - run: npm run build:host
      - run: npx playwright install --with-deps chromium
        working-directory: platform/apps/host
      - run: npx playwright test
        working-directory: platform/apps/host
  route-governor:
    name: Route governor proof surface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck route governor
        run: npm run typecheck:route-governor

      - name: Typecheck processor fabric
        run: npm run typecheck:processor-fabric

      - name: Typecheck proof evaluation
        run: npm run typecheck:proof-evaluation

      - name: Test route governor
        run: npm run test:route-governor

      - name: Run proof examples
        id: proof_examples
        run: |
          set +e
          : > route-governor-proof-output.log
          npm run proof:route-governor 2>&1 | tee -a route-governor-proof-output.log
          route_status=${PIPESTATUS[0]}
          npm run proof:processor-fabric 2>&1 | tee -a route-governor-proof-output.log
          processor_status=${PIPESTATUS[0]}
          npm run proof:proof-evaluation 2>&1 | tee -a route-governor-proof-output.log
          evaluation_status=${PIPESTATUS[0]}
          if [ "$route_status" -ne 0 ]; then
            status="$route_status"
          elif [ "$processor_status" -ne 0 ]; then
            status="$processor_status"
          elif [ "$evaluation_status" -ne 0 ]; then
            status="$evaluation_status"
          else
            status=0
          fi
          {
            echo "## Platform proof output"
            echo
            echo "Head: \`${GITHUB_SHA}\`"
            echo "Exit code: \`${status}\`"
            echo
            echo "Last 120 output lines:"
            echo
            echo '```text'
            tail -n 120 route-governor-proof-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload route governor proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-governor-proof-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/route-governor-proof-output.log
          if-no-files-found: warn
