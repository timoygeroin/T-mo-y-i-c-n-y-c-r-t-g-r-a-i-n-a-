name: Monday Platform CI

on:
  push:
    branches:
      - main
      - monday-platform-genesis-01
      - agent/mondayid-one-v1
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  route-governor:
    name: Route governor proof surface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck route governor
        run: npm run typecheck:route-governor
      - name: Typecheck processor fabric
        run: npm run typecheck:processor-fabric
      - name: Typecheck proof evaluation
        run: npm run typecheck:proof-evaluation
      - name: Test route governor
        run: npm run test:route-governor
      - name: Run proof examples
        run: |
          npm run proof:route-governor
          npm run proof:processor-fabric
          npm run proof:proof-evaluation
          npm run proof:one
          npm run proof:work
          npm run proof:focus-object
          npm run proof:focus-object-surface
          npm run proof:focus-object-expertise-release
          npm run proof:focus-object-evidence-transition
