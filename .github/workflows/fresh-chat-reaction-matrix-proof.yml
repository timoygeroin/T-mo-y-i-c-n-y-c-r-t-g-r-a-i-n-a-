name: Fresh Chat Reaction Matrix

on:
  pull_request:
    paths:
      - "platform/recovery/fresh-chat-phenotype.mjs"
      - "platform/recovery/fresh-chat-reaction-matrix-proof.mjs"
      - ".github/workflows/fresh-chat-reaction-matrix-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reaction-matrix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run combinatorial reaction matrix
        run: node platform/recovery/fresh-chat-reaction-matrix-proof.mjs
