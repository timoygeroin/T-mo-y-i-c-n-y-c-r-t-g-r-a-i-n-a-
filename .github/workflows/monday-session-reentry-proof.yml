name: Monday Session Re-entry Proof

on:
  push:
    branches:
      - monday/continuum-runtime-integration-20260914
  pull_request:
    paths:
      - 'platform/runtime/**'
      - '.github/workflows/monday-session-reentry-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-reentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove runtime survives process boundary
        working-directory: platform
        run: node runtime/session-reentry-proof.mjs
