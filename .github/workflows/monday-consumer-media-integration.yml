name: Monday Consumer Space Depth Integration

on:
  push:
    branches:
      - monday/continuum-runtime-integration-20260914
    paths:
      - platform/apple-host/tools/patch_space_depth.py
      - .github/workflows/monday-consumer-media-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday/continuum-runtime-integration-20260914
          fetch-depth: 0
      - name: Apply guarded space depth patch
        run: python3 platform/apple-host/tools/patch_space_depth.py
      - name: Product rejection gate
        run: node product/verify-product-contract.mjs
      - name: Static postcondition checks
        run: |
          SRC=platform/apple-host/MondayIDHost/MondayIDHostApp.swift
          grep -q 'NavigationLink { MondayTaskDetailView(taskID: task.id) }' "$SRC"
          test "$(grep -c 'NavigationLink { MondayDocumentDetailView(documentID: doc.id) }' "$SRC")" -ge 2
          test "$(grep -c 'NavigationLink { MondayTaskDetailView(taskID: task.id) }' "$SRC")" -ge 3
          ! grep -A8 'case 2:' "$SRC" | grep -q 'ForEach(documents) { doc in Label'
      - name: Apple adapter runtime tests
        run: swift test --package-path platform/apple-adapter
      - name: Build iOS consumer body
        run: |
          xcodebuild \
            -project platform/apple-host/MondayIDHost.xcodeproj \
            -scheme MondayIDHost \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Commit verified source mutation
        run: |
          if git diff --quiet; then
            echo 'Patch already present; no source commit required.'
            exit 0
          fi
          git config user.name 'MondayID Execution'
          git config user.email 'actions@users.noreply.github.com'
          git add platform/apple-host/MondayIDHost/MondayIDHostApp.swift
          git commit -m 'feat(consumer): make home and space objects actionable'
          git push origin HEAD:monday/continuum-runtime-integration-20260914
