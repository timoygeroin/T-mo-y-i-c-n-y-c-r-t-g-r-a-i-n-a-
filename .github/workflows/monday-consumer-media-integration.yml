name: Monday Consumer Space Depth Proof

on:
  push:
    branches:
      - monday/continuum-runtime-integration-20260914
    paths:
      - platform/apple-host/MondayIDHost/MondayIDHostApp.swift
      - platform/apple-host/MondayIDHost.xcodeproj/project.pbxproj
      - platform/apple-adapter/**
      - product/**
      - .github/workflows/monday-consumer-media-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-space-depth:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday/continuum-runtime-integration-20260914
          fetch-depth: 0
      - name: Record exact head
        run: git rev-parse HEAD
      - name: Product rejection gate
        run: node product/verify-product-contract.mjs
      - name: Verify space depth source postconditions
        run: |
          SRC=platform/apple-host/MondayIDHost/MondayIDHostApp.swift
          test "$(grep -c 'NavigationLink { MondayDocumentDetailView(documentID: doc.id) }' "$SRC")" -ge 2
          test "$(grep -c 'NavigationLink { MondayTaskDetailView(taskID: task.id) }' "$SRC")" -ge 3
          ! grep -A8 'case 2:' "$SRC" | grep -q 'ForEach(documents) { doc in Label'
      - name: Apple adapter runtime tests
        run: swift test --package-path platform/apple-adapter
      - name: Build iOS consumer body
        run: |
          xcodebuild \
            -project platform/apple-host/MondayIDHost.xcodeproj \
            -scheme MondayIDHost \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
