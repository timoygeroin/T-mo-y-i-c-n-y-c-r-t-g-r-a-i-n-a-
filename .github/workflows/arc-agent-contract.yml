name: ARC-AGI-3 agent contract
on:
  push:
    paths:
      - 'competitions/arc-agi-3/**'
      - '.github/workflows/arc-agent-contract.yml'
  pull_request:
    paths:
      - 'competitions/arc-agi-3/**'
      - '.github/workflows/arc-agent-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile agent
        run: python -m py_compile competitions/arc-agi-3/agent/my_agent.py
      - name: Run offline interface tests
        working-directory: competitions/arc-agi-3
        run: python -m unittest discover -s tests -v
