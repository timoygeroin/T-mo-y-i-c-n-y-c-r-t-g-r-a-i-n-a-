name: MondayID Convergence Proof

on:
  pull_request:
    paths:
      - "platform/convergence/**"
      - ".github/workflows/mondayid-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove cross-cell convergence invariants
        run: node platform/convergence/convergence-proof.mjs
