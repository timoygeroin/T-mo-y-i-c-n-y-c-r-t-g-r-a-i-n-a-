name: Velvet iOS build
on:
  push:
    branches: ["monday/velvet-ios-build-20261127"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start simulator while the client compiles
        id: sim
        run: |
          device="$(xcrun simctl list -j devices available | python3 -c 'import json, sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Compile native client for iPhone and Simulator
        run: bash platform/apple-host/tools/compile_velvet.sh
      - name: Verify compiled archives
        run: |
          unzip -tq velvet-build/Velvet-code.ipa
          unzip -tq velvet-build/Velvet-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: velvet-code-and-simulator
          path: velvet-build/*
          retention-days: 3
          if-no-files-found: error

      - name: Launch the compiled host on an iPhone simulator
        run: |
          set -euo pipefail
          device="${{ steps.sim.outputs.device }}"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/monday-velvet-build/simulator/Build/Products/Release-iphonesimulator/MondayIDHost.app"
          launch="$(xcrun simctl launch "$device" com.mondayid.host)"
          echo "$launch"
          pid="${launch##*: }"
          [[ "$pid" =~ ^[0-9]+$ ]]
          sleep 5
          ps -p "$pid" -o pid=,comm= | tee "$RUNNER_TEMP/velvet-process.txt"
          grep -F '/MondayIDHost.app/MondayIDHost' "$RUNNER_TEMP/velvet-process.txt"
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/velvet-screen.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/velvet-screen.png"
