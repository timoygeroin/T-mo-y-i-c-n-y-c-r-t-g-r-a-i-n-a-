name: Revenue Portfolio Visual

on:
  pull_request:
    paths:
      - "platform/revenue/portfolio/lead-intake-triage/portfolio.html"
      - ".github/workflows/revenue-portfolio-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser runtime
        run: |
          npm install -g agent-browser
          npx agent-browser install
      - name: Serve portfolio page
        run: |
          python3 -m http.server 4173 --directory platform/revenue/portfolio/lead-intake-triage >/tmp/portfolio-http.log 2>&1 &
          sleep 2
      - name: Render and inspect visual
        run: |
          mkdir -p portfolio-visual-evidence
          agent-browser open http://127.0.0.1:4173/portfolio.html
          agent-browser wait --load networkidle
          agent-browser get title > portfolio-visual-evidence/title.txt
          agent-browser get url > portfolio-visual-evidence/url.txt
          agent-browser snapshot > portfolio-visual-evidence/snapshot.txt
          agent-browser get text body > portfolio-visual-evidence/body.txt
          agent-browser screenshot --full portfolio-visual-evidence/lead-intake-triage.png
          grep -q "AI Lead Intake Triage" portfolio-visual-evidence/body.txt
          grep -q "Synthetic demo" portfolio-visual-evidence/body.txt
          grep -q "11 / 11" portfolio-visual-evidence/body.txt
          grep -q "Human approval" portfolio-visual-evidence/body.txt
          printf '{"result":"PORTFOLIO_VISUAL_PASS","claims":"synthetic_demo_only","acceptance_checks":4}\n' > portfolio-visual-evidence/receipt.json
          agent-browser close
      - name: Upload portfolio visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-intake-portfolio-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: portfolio-visual-evidence/
          if-no-files-found: error
