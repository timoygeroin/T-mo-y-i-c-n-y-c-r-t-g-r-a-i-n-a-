name: ARC-AGI-3 TEMP click-consistency 500 public A-B
on:
  pull_request:
    paths:
      - '.github/workflows/arc-agent-click-consistency-500-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same_budget_public_ab:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing test-first candidate contract and scorecard controls
        working-directory: competitions/arc-agi-3
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_click_consistency_candidate.py' -v
          python -m unittest discover -s tests -p 'test_compare_public_logs.py' -v
      - name: Fetch official ARC starter
        run: git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
      - name: Install official Python 3.12 public runtime
        working-directory: arc-starter
        run: make setup PYTHON=python3.12
      - name: Frozen agent 25 official public games at 500
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee click500-frozen.log
      - name: Isolated consistency agent same 25 official public games at 500
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/candidate_click_consistency.py arc-starter/agent/my_agent.py
          (cd arc-starter && make play-local STEPS=500) | tee click500-consistency.log
      - name: Compare local public results without promotion
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py click500-frozen.log click500-consistency.log --output click500-ab.json | tee click500-summary.log
      - name: Preserve raw public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: click500-consistency-public-ab
          path: |
            click500-frozen.log
            click500-consistency.log
            click500-ab.json
            click500-summary.log
          if-no-files-found: ignore
