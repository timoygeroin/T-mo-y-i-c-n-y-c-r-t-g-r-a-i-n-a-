name: Monday Consumer Activity State Mutation

on:
  push:
    branches:
      - monday/continuum-runtime-integration-20260914
    paths:
      - '.github/workflows/monday-consumer-activity-state-mutation.yml'

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday/continuum-runtime-integration-20260914
          fetch-depth: 0
      - name: Extend truthful task/activity states
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('platform/apple-host/MondayIDHost/MondayIDHostApp.swift')
          text = path.read_text()

          marker = '    case waiting = "Waiting"\n    case needsYou = "Needs you"\n    case completed = "Completed"\n    case failed = "Failed"'
          replacement = '    case running = "Running"\n    case waiting = "Waiting"\n    case needsYou = "Needs you"\n    case completed = "Completed"\n    case failed = "Failed"\n    case changed = "Changed"'
          assert marker in text, 'task state enum drifted'
          text = text.replace(marker, replacement, 1)

          action_marker = '        .swipeActions {\n            if task.state != .completed { Button("Complete") { store.setTaskState(task.id, state: .completed) }.tint(.green) }\n            Button("Needs you") { store.setTaskState(task.id, state: .needsYou) }.tint(.orange)\n        }'
          action_replacement = action_marker + '\n        .contextMenu {\n            Button("Running") { store.setTaskState(task.id, state: .running) }\n            Button("Waiting") { store.setTaskState(task.id, state: .waiting) }\n            Button("Changed") { store.setTaskState(task.id, state: .changed) }\n            Button("Failed") { store.setTaskState(task.id, state: .failed) }\n        }'
          assert action_marker in text, 'task row actions drifted'
          text = text.replace(action_marker, action_replacement, 1)

          running_marker = '                Section("Running") { Text("No executor is active.").foregroundStyle(.secondary) }'
          running_replacement = '''                Section("Running") {
                    let rows = store.tasks.filter { $0.state == .running }
                    if rows.isEmpty { Text("No executor is active.").foregroundStyle(.secondary) }
                    else { ForEach(rows) { MondayTaskRow(task: $0) } }
                }'''
          assert running_marker in text, 'running activity section drifted'
          text = text.replace(running_marker, running_replacement, 1)

          recent_anchor = '                Section("Recent changes") {'
          semantic_sections = '''                Section("Changed") {
                    let rows = store.tasks.filter { $0.state == .changed }
                    if rows.isEmpty { Text("No changed local tasks.").foregroundStyle(.secondary) }
                    else { ForEach(rows) { MondayTaskRow(task: $0) } }
                }
                Section("Failed") {
                    let rows = store.tasks.filter { $0.state == .failed }
                    if rows.isEmpty { Text("No failed local tasks.").foregroundStyle(.secondary) }
                    else { ForEach(rows) { MondayTaskRow(task: $0) } }
                }
'''
          assert recent_anchor in text, 'recent changes anchor drifted'
          text = text.replace(recent_anchor, semantic_sections + recent_anchor, 1)

          path.write_text(text)
          PY
      - name: Remove one-shot mutator
        run: rm .github/workflows/monday-consumer-activity-state-mutation.yml
      - name: Commit mutation
        run: |
          git config user.name 'mondayid-continuum-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add platform/apple-host/MondayIDHost/MondayIDHostApp.swift .github/workflows/monday-consumer-activity-state-mutation.yml
          git commit -m 'feat(consumer): expose truthful Activity task states'
          git push origin HEAD:monday/continuum-runtime-integration-20260914
