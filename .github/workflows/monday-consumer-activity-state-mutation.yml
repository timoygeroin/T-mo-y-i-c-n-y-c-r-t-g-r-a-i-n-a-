name: Monday Consumer Activity State Mutation

on:
  push:
    branches:
      - monday/continuum-runtime-integration-20260914
    paths:
      - '.github/workflows/monday-consumer-activity-state-mutation.yml'

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday/continuum-runtime-integration-20260914
          fetch-depth: 0
      - name: Apply mutation
        run: python3 scripts/mutate_consumer_activity.py
      - name: Remove one-shot helpers
        run: |
          rm .github/workflows/monday-consumer-activity-state-mutation.yml
          rm scripts/mutate_consumer_activity.py
      - name: Commit mutation
        run: |
          git config user.name mondayid-continuum-bot
          git config user.email actions@users.noreply.github.com
          git add platform/apple-host/MondayIDHost/MondayIDHostApp.swift .github/workflows/monday-consumer-activity-state-mutation.yml scripts/mutate_consumer_activity.py
          git commit -m 'feat(consumer): expose truthful Activity task states'
          git push origin HEAD:monday/continuum-runtime-integration-20260914
