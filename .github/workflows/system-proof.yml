name: MondayID system proof
on:
  push:
  pull_request:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verify Monday consumer surface data integrity and continuity
        run: |
          node --check surfaces/02/app.js
          node surfaces/02/qa-node.cjs
          node surfaces/02/qa-continuity.cjs
      - run: npm run boot
      - name: Verify public external Worldline denies anonymous access
        run: node scripts/prove-worldline-private-live.mjs
      - name: Prove live Monday Host public route and private-tool denial
        run: node scripts/prove-carrier-live.mjs
      - name: Prove deployed OAuth discovery and deny ownerless consent
        run: node scripts/prove-oauth-public-live.mjs
