name: MondayID system proof
on:
  push:
  pull_request:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run boot
      - name: Boot from live external Worldline
        env:
          MONDAYID_WORLDLINE_URL: https://adamant-raven-783.eu-west-1.convex.site
        run: npm run boot
