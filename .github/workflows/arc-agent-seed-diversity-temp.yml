name: ARC-AGI-3 temporary official SDK seed-diversity probe
on:
  pull_request:
    paths:
      - '.github/workflows/arc-agent-seed-diversity-temp.yml'
permissions:
  contents: read
jobs:
  seed-diversity:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official starter and frozen agent
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
          (cd arc-starter && make setup PYTHON=python3.12)
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
      - name: Validate official SDK seed control and execute frozen public seed probe
        run: |
          set -o pipefail
          arc-starter/.venv/bin/python - <<'PY' | tee arc-seed-diversity-result.log
          import collections, hashlib, inspect, json, sys, traceback
          from pathlib import Path
          root=Path('arc-starter').resolve()
          sys.path.insert(0,str(root))
          sys.path.insert(0,str(root/'vendor'/'ARC-AGI-3-Agents'))
          import arc_agi
          from arc_agi import OperationMode
          from scripts.play_local import load_my_agent_class
          agent_bytes=(root/'agent'/'my_agent.py').read_bytes()
          assert b'MAX_ACTIONS = 500' in agent_bytes
          print('FROZEN_AGENT_SHA256',hashlib.sha256(agent_bytes).hexdigest(),flush=True)
          seeds=[0,1,2,3,4,7,17,42,2026,65535]
          max_steps=16
          arc=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          assert 'seed' in inspect.signature(arc.make).parameters, 'SDK lacks explicit seed parameter'
          ids=sorted({e.game_id.split('-')[0] for e in arc.get_environments()})
          assert len(ids)==25, 'official public roster not 25; do not compare incomplete cohort'
          Cls=load_my_agent_class()
          Cls.MAX_ACTIONS=max_steps
          results={}
          errors=[]
          for game_id in ids:
              results[game_id]={}
              for seed in seeds:
                  try:
                      env=arc.make(game_id,seed=seed)
                      if env is None:
                          raise RuntimeError('arc.make returned None')
                      agent=Cls(card_id='seed-probe-local',game_id=game_id,
                                agent_name='MyAgent.seedprobe.'+game_id,
                                ROOT_URL='http://localhost',record=False,
                                arc_env=env,tags=['seed-probe'])
                      observed=[]
                      original=agent.choose_action
                      def capture(frames,latest):
                          action=original(frames,latest)
                          grid=getattr(latest,'frame',None)
                          digest=hashlib.sha256(json.dumps(grid,separators=(',',':')).encode()).hexdigest()[:20]
                          payload=getattr(action,'payload',None)
                          observed.append({'pre_frame':digest,
                              'level':int(getattr(latest,'levels_completed',0) or 0),
                              'action':action.name,
                              'xy':dict(payload) if action.name=='ACTION6' and isinstance(payload,dict) else None})
                          return action
                      agent.choose_action=capture
                      agent.main()
                      results[game_id][str(seed)]={
                          'observed':observed,
                          'first_playable':next((x['pre_frame'] for x in observed if x['action']!='RESET'),None),
                          'levels':int(getattr(agent.frames[-1],'levels_completed',0) or 0),
                          'actions':agent.action_counter}
                  except Exception as exc:
                      errors.append({'game':game_id,'seed':seed,'error':repr(exc)})
                      print('ERROR',game_id,seed,repr(exc),flush=True)
              print('GAME_DONE',game_id,'seeds',len(results[game_id]),flush=True)
          changed_initial=[]
          changed_trajectory=[]
          for gid,records in results.items():
              if len(records)!=len(seeds):continue
              base=records['0']
              if any(r['first_playable']!=base['first_playable'] for r in records.values()):
                  changed_initial.append(gid)
              if any(r['observed']!=base['observed'] for r in records.values()):
                  changed_trajectory.append(gid)
          report={
              'schema':'mondayid.arc3.official_sdk_seed_diversity_probe.v1',
              'status':'PUBLIC_SEED_PROBE_NOT_GENERALIZATION_PROOF',
              'official_sdk_make_accepts_seed':True,
              'frozen_agent_sha256':hashlib.sha256(agent_bytes).hexdigest(),
              'public_games_expected':25,
              'public_games_found':len(ids),
              'seeds':seeds,'max_actions_per_game':max_steps,
              'expected_episodes':len(ids)*len(seeds),
              'completed_episodes':sum(map(len,results.values())),
              'errors':errors,
              'changed_initial_frame_games':changed_initial,
              'changed_logged_trajectory_games':changed_trajectory,
              'data':results,
              'limitations':['Previously reused 25 public games; not unseen.',
                             'Visible frame and action logs cannot authenticate latent reset diversity.',
                             '16-step cap tests early differences only, not long-horizon stochasticity.',
                             'No candidate A/B, no Kaggle hidden score or submission.']}
          Path('arc-seed-diversity-result.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('SUMMARY',json.dumps({k:v for k,v in report.items() if k!='data'},sort_keys=True),flush=True)
          assert not errors, 'Incomplete public game/seed cohort; do not infer negative seed diversity'
          assert report['completed_episodes']==report['expected_episodes']
          PY
      - name: Preserve complete official public seed probe, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-agi3-official-sdk-seed-diversity
          path: |
            arc-seed-diversity-result.json
            arc-seed-diversity-result.log
          if-no-files-found: ignore
