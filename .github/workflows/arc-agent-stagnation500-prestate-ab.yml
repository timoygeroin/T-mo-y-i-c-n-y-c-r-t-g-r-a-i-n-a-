name: ARC-AGI-3 isolated stagnation 500-action prestate A-B
on:
  pull_request:
    paths:
      - '.github/workflows/arc-agent-stagnation500-prestate-ab.yml'
permissions:
  contents: read
jobs:
  public_ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test frozen invariants and existing stagnation candidate before gameplay
        working-directory: competitions/arc-agi-3
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_click_stagnation_candidate.py' -v
          python -m unittest discover -s tests -p 'test_compare_public_logs.py' -v
      - name: Fetch official public ARC-AGI-3 starter
        run: git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git arc-starter
      - name: Install official Python 3.12 runtime
        working-directory: arc-starter
        run: make setup PYTHON=python3.12
      - name: FROZEN baseline at official 500-action cap
        run: |
          set -o pipefail
          cp competitions/arc-agi-3/agent/my_agent.py arc-starter/agent/my_agent.py
          python - <<'PY'
          from pathlib import Path
          path=Path('arc-starter/agent/my_agent.py')
          src=path.read_text()
          needle='        return action\n'
          assert src.count(needle)==1
          audit=(
              "        _ax, _ay = self._last_position if action.name == 'ACTION6' and self._last_position is not None else (-1, -1)\n"
              "        print('ARC_PREACTION game=%s step=%d level=%d key=%s action=%s x=%d y=%d' % (self.game_id, self._steps, level, key[1], action.name, _ax, _ay), flush=True)\n"
          )
          path.write_text(src.replace(needle,audit+needle))
          compile(path.read_text(),str(path),'exec')
          PY
          (cd arc-starter && make play-local STEPS=500) | tee arc-stagnation500-frozen.log
      - name: H1 isolated click-only stagnation candidate at SAME 500-action cap
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/click_stagnation_variant.py --source competitions/arc-agi-3/agent/my_agent.py --output arc-starter/agent/my_agent.py
          python - <<'PY'
          from pathlib import Path
          path=Path('arc-starter/agent/my_agent.py')
          src=path.read_text()
          needle='        return action\n'
          assert src.count(needle)==1
          audit=(
              "        _ax, _ay = self._last_position if action.name == 'ACTION6' and self._last_position is not None else (-1, -1)\n"
              "        print('ARC_PREACTION game=%s step=%d level=%d key=%s action=%s x=%d y=%d' % (self.game_id, self._steps, level, key[1], action.name, _ax, _ay), flush=True)\n"
          )
          path.write_text(src.replace(needle,audit+needle))
          compile(path.read_text(),str(path),'exec')
          PY
          (cd arc-starter && make play-local STEPS=500) | tee arc-stagnation500-candidate.log
      - name: Compare official scorecards and matched pre-action visible states
        run: |
          set -o pipefail
          python competitions/arc-agi-3/tools/compare_public_logs.py arc-stagnation500-frozen.log arc-stagnation500-candidate.log --output arc-stagnation500-scorecard.json | tee arc-stagnation500-summary.log
          python - <<'PY'
          import collections, json, re
          from pathlib import Path
          pat=re.compile(r'^ARC_PREACTION game=(\S+) step=(\d+) level=(\d+) key=([0-9a-f]+) action=(ACTION\d+) x=(-?\d+) y=(-?\d+)',re.M)
          def read(path):
              rows={}
              for game,step,level,key,action,x,y in pat.findall(Path(path).read_text()):
                  idx=(game,int(step))
                  assert idx not in rows, idx
                  rows[idx]=(int(level),key,action,int(x),int(y))
              return rows
          a=read('arc-stagnation500-frozen.log')
          b=read('arc-stagnation500-candidate.log')
          assert a and b
          pairs=set(a)&set(b)
          initial=sorted((k,a[k][1],b[k][1]) for k in pairs if k[1]==1)
          same_state=[k for k in pairs if a[k][:2]==b[k][:2]]
          click_pairs=[k for k in same_state if a[k][2]=='ACTION6' and b[k][2]=='ACTION6']
          summary={
              'provenance':'OFFICIAL_PUBLIC_VISIBLE_PRESTATE_NOT_LATENT_SEED_PAIRING',
              'precommitted_hypotheses':{
                  'H0':'frozen policy no worse at same 500 action cap',
                  'H1':'after 128 click-only level-zero actions, uniform-first may accelerate first-level discovery',
                  'H2':'visible click responsiveness may be nonprogress animation; changed click coordinates may not improve levels'},
              'frozen_preactions':len(a),'candidate_preactions':len(b),
              'matched_game_step_pairs':len(pairs),
              'initial_visible_states_matched':sum(x==y for _,x,y in initial),
              'initial_visible_states_total':len(initial),
              'same_visible_prestate_and_level_pairs':len(same_state),
              'same_visible_prestate_action_enum_differences':sum(a[k][2]!=b[k][2] for k in same_state),
              'same_visible_prestate_click_pairs':len(click_pairs),
              'same_visible_prestate_click_coordinate_differences':sum(a[k][3:]!=b[k][3:] for k in click_pairs),
              'level_state_disagreements_on_matched_steps':sum(a[k][0]!=b[k][0] for k in pairs),
              'independent_latent_seed_pairing':False,
              'held_out_unseen_games':False,
              'automatic_promotion':False
          }
          Path('arc-stagnation500-prestate-audit.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Preserve full official public logs and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-stagnation500-prestate-public-ab
          path: |
            arc-stagnation500-frozen.log
            arc-stagnation500-candidate.log
            arc-stagnation500-scorecard.json
            arc-stagnation500-summary.log
            arc-stagnation500-prestate-audit.json
          if-no-files-found: ignore
