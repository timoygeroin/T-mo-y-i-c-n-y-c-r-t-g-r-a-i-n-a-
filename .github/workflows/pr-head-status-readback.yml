name: PR Head Status Readback

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to read
        required: false
        default: "2"
      expected_head:
        description: Optional expected PR head SHA guard
        required: false
        default: ""

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  read-pr-head-status:
    name: Read PR head status
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number || '2' }}
      EXPECTED_HEAD: ${{ inputs.expected_head || github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      STATUS_READBACK_ISSUE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Read status for guarded PR head
        id: readback
        run: |
          set +e
          node platform/tools/read-github-head-status.mjs \
            --repo="${GITHUB_REPOSITORY}" \
            --pr="${PR_NUMBER}" \
            --expected-head="${EXPECTED_HEAD}" \
            > pr-head-status-readback.json
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          {
            echo "# PR head status readback"
            echo
            echo "Repository: \`${GITHUB_REPOSITORY}\`"
            echo "PR: \`${PR_NUMBER}\`"
            echo "Expected head: \`${EXPECTED_HEAD}\`"
            echo "Tool exit code: \`${status}\`"
            echo
            echo '```json'
            cat pr-head-status-readback.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload readback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-head-status-readback
          path: pr-head-status-readback.json
          if-no-files-found: warn

      - name: Publish readback to blocker issue
        if: always()
        env:
          EXIT_CODE: ${{ steps.readback.outputs.exit_code }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const repo = process.env.GITHUB_REPOSITORY;
          const [owner, name] = repo.split('/');
          const issue = process.env.STATUS_READBACK_ISSUE || '1';
          const token = process.env.GITHUB_TOKEN;
          const marker = '<!-- monday-pr-head-status-readback -->';
          const readbackPath = 'pr-head-status-readback.json';
          const readback = fs.existsSync(readbackPath)
            ? fs.readFileSync(readbackPath, 'utf8')
            : '{"error":"pr-head-status-readback.json was not produced"}';
          const body = `${marker}\n# PR head status readback\n\nRepository: \`${repo}\`\nPR: \`${process.env.PR_NUMBER}\`\nExpected head: \`${process.env.EXPECTED_HEAD}\`\nWorkflow run: ${process.env.GITHUB_SERVER_URL}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}\nTool exit code: \`${process.env.EXIT_CODE || 'unknown'}\`\n\n\`\`\`json\n${readback}\n\`\`\``;

          async function github(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.headers || {}),
              },
            });
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${path} failed: ${response.status} ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          }

          (async () => {
            const comments = await github(`/repos/${owner}/${name}/issues/${issue}/comments?per_page=100`);
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github(`/repos/${owner}/${name}/issues/comments/${existing.id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ body }),
              });
              return;
            }
            await github(`/repos/${owner}/${name}/issues/${issue}/comments`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ body }),
            });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
