name: Monday Continuity Proof

on:
  push:
    branches:
      - monday/continuum-runtime-integration-20260914
    paths:
      - 'platform/continuity/**'
      - '.github/workflows/monday-continuity-proof.yml'
  pull_request:
    paths:
      - 'platform/continuity/**'
      - '.github/workflows/monday-continuity-proof.yml'

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove continuity acceptance surface
        run: node platform/continuity/continuity-runtime-proof.mjs
