function home(){const rec=latest().slice(0,3);const g=db.goals.find(g=>g.id===db.activeGoal)||db.goals[0];const hero=`<div class="home-hero"><div class="eyebrow">MONDAY · ТВОЯ НЕПРЕРЫВНАЯ ЛИНИЯ</div><div class="hero-divider"></div><h1 class="hero-heading">Не нужно<br><em>начинать заново.</em></h1><p class="lead">Одна мысль. Любая форма. Продолжай начатое или просто скажи, что должно стать возможным.</p></div><form class="write-box" data-form="new-thread"><textarea id="homeDraft" name="text" aria-label="Новое намерение" maxlength="12000" placeholder="Что должно стать возможным?">${esc(db.drafts.home||'')}</textarea><div class="write-actions"><div class="write-actions-left"><button class="icon-btn" type="button" data-do="voice-home" aria-label="Диктовка">${ic('mic')}</button><span class="subtle-note">Мысль сохранится как диалог</span></div><button class="send-btn" type="submit">Начать ${ic('arrow')}</button></div></form><div class="subtle-note">Текущая версия сохраняет разговор локально. Ответы AI не подключены.</div>`;const cont=g?`<section class="resume-line"><div class="eyebrow">НЕЗАКОНЧЕННОЕ</div><h3>${esc(g.title)}</h3><p class="lead">${esc(g.criteria||'Критерий результата ещё не определён')}</p><div class="two-actions">${action('Продолжить',`goal:${g.id}`,'outline-btn')}</div></section>`:'';const recent=`<section class="section"><div class="section-head"><h2>Твоя линия</h2>${smallButton('Вся история →','chats')}</div>${rec.length?rec.map(o=>`<div class="row-card"><div class="grow"><button class="row-button" data-do="open:${o.kind}:${o.id}"><h3>${esc(o.title)}</h3><p>${o.kind==='thread'?'Диалог':o.kind==='goal'?'Работа':'Заметка'} · ${date(o.updatedAt||o.createdAt)}</p></button></div><span class="line-label">${ic('arrow',17)}</span></div>`).join(''):'<div class="empty">Пока нет сохранённых объектов. Начни с одной мысли — и она останется здесь.</div>'}</section>`;base(hero+cont+recent+'<footer class="meta-footer">Твои данные не отправляются в модель автоматически. Изменения можно экспортировать.</footer>',{title:'Сегодня'})}
function chats(){let sorted=db.threads.slice().sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));base(`<div class="header-row"><div><div class="eyebrow">РАЗГОВОРЫ</div><h1>Диалоги</h1></div>${action(ic('plus')+' Новый', 'newthread')}</div><input class="search-field" id="threadSearch" placeholder="Найти диалог" aria-label="Поиск диалогов"><div id="threadList">${sorted.length?sorted.map(t=>`<div class="row-card" data-thread-title="${esc(t.title.toLowerCase())}"><div class="grow"><button class="row-button" data-open-thread="${esc(t.id)}"><h3>${esc(t.title)}</h3><p>${t.messages.length} сообщений · ${date(t.updatedAt)}</p></button></div><button class="icon-btn" data-do="rename-thread:${t.id}" aria-label="Переименовать">${ic('edit',17)}</button></div>`).join(''):'<div class="empty">Каждый диалог может продолжаться — даже если ты отвлёкся.</div>'}</div>`,{title:'Диалоги'})}
function thread(){const t=db.threads.find(x=>x.id===threadId);if(!t)return go('chats');const msgs=t.messages.map(m=>`<div class="msg ${m.role==='user'?'user':'system'}">${esc(m.text)}</div>`).join('');base(`<div class="header-row"><div><button class="flat-btn" data-nav="chats">${ic('left',16)} К диалогам</button><h2 style="margin-top:8px">${esc(t.title)}</h2><p class="subtle-note">Сохранено здесь · ${t.messages.length} сообщений</p></div><button class="icon-btn" data-do="thread-menu" aria-label="Действия диалога">${ic('more')}</button></div><div class="message-history">${msgs}${!msgs?'<div class="empty">Начни со своей мысли.</div>':''}<div class="status-text">AI-ответы пока не подключены. Ничего не будет сгенерировано без подтверждённого подключения.</div></div><div class="chat-compose"><form class="write-box" data-form="message"><textarea id="chatDraft" name="text" maxlength="12000" aria-label="Продолжение диалога" placeholder="Продолжи мысль…">${esc(db.drafts.chat||'')}</textarea><div class="write-actions"><div class="write-actions-left"><button class="icon-btn" data-do="voice-chat" type="button" aria-label="Диктовать">${ic('mic')}</button><button class="flat-btn" type="button" data-do="why-no-ai">Почему нет AI?</button></div><button class="send-btn" type="submit">Сохранить ${ic('arrow')}</button></div></form></div>`,{title:t.title,crumb:'Диалоги / '+t.title})}
function work(){const gs=db.goals.slice().sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));base(`<div class="header-row"><div><div class="eyebrow">ОТ НАМЕРЕНИЯ К РЕЗУЛЬТАТУ</div><h1>Работа</h1></div>${action(ic('plus')+' Цель','newgoal')}</div><p class="lead">Здесь живут незаконченные задачи. Не проценты прогресса, а реальные действия и доказательства.</p><div class="section">${gs.length?gs.map(g=>`<div class="row-card"><div class="grow"><button class="row-button" data-do="goal:${g.id}"><h3>${esc(g.title)}</h3><p>${g.state==='VERIFIED'?'Подтверждено':g.state==='ACTIVE'?'В работе':'Черновик'} · ${g.steps.filter(s=>s.done).length} / ${g.steps.length} действий</p></button></div><span class="line-label">${ic('arrow')}</span></div>`).join(''):'<div class="empty">Создай первую цель. Здесь можно разбить её на реальные действия и подтверждать результаты.</div>'}</div>`,{title:'Работа'})}
function goal(){const g=currentGoal();if(!g)return go('work');const st=g.steps||[];base(`<div class="header-row"><div><button class="flat-btn" data-nav="work">${ic('left',16)} Все цели</button><h2 style="margin-top:8px">${esc(g.title)}</h2><p class="subtle-note">${g.state==='VERIFIED'?'Результат подтверждён':g.state==='ACTIVE'?'В работе':'Черновик'} · ${date(g.updatedAt)}</p></div><button class="icon-btn" data-do="goal-menu" aria-label="Действия цели">${ic('more')}</button></div><div class="eyebrow">КРИТЕРИЙ ГОТОВНОСТИ</div><p style="font-size:17px;line-height:1.6">${esc(g.criteria||'Пока не определён')}</p><button class="flat-btn" data-do="edit-criteria">Изменить критерий</button><div class="rule"></div><div class="section-head"><h2>Действия</h2><span class="line-label">${st.filter(s=>s.done).length} из ${st.length}</span></div><div class="dense-list">${st.length?st.map(s=>`<label class="checkrow ${s.done?'done':''}"><input type="checkbox" data-step="${s.id}" ${s.done?'checked':''}><span class="grow">${esc(s.text)}</span><button class="icon-btn" type="button" data-do="remove-step:${s.id}" aria-label="Удалить действие">${ic('close',16)}</button></label>`).join(''):'<div class="empty">Добавь первый конкретный шаг.</div>'}</div><form data-form="step" class="field" style="margin-top:22px"><label for="stepInput">Следующее действие</label><div style="display:flex;gap:8px"><input id="stepInput" name="text" maxlength="300" placeholder="Что сделать?"><button class="send-btn" type="submit" aria-label="Добавить действие">${ic('plus')}</button></div></form><div class="section"><div class="section-head"><h2>Доказательство</h2></div>${g.proof?`<div class="notice-box">${esc(g.proof)}<div class="subtle-note" style="margin-top:7px">Записано пользователем · без внешней верификации</div></div>`:'<p class="subtle-note">Результат можно отметить подтверждённым только после явного доказательства.</p>'}<div class="two-actions">${action('Записать доказательство','proof','outline-btn')}${action('Удалить цель','delete-goal','outline-btn danger')}</div></div>`,{title:g.title,crumb:'Работа / '+g.title})}
function spaces(){base(`<div class="header-row"><div><div class="eyebrow">ПРОСТРАНСТВА</div><h1>Мир</h1></div>${action(ic('plus')+' Создать','newspace')}</div><p class="lead">Разные проекты и роли, одна непрерывная история. Пространства — локальные категории, а не отдельные личности.</p><div class="section">${db.spaces.length?db.spaces.map(s=>`<div class="row-card"><div class="grow"><h3>${esc(s.title)}</h3><p>${esc(s.description||'Локальное пространство')}</p></div>${action('Редактировать',`edit-space:${s.id}`,'flat-btn')}</div>`).join(''):'<div class="empty">Создай пространство для проекта или области жизни, когда оно действительно понадобится.</div>'}</div>`,{title:'Пространства'})}
function library(){base(`<div class="header-row"><div><div class="eyebrow">ЗНАНИЯ И ДОКУМЕНТЫ</div><h1>Библиотека</h1></div>${action(ic('plus')+' Заметка','newnote')}</div><p class="lead">Сохраняй источники и мысли. Пока данные живут только в этом браузере.</p><div class="two-actions">${action('Импортировать текстовый файл','import-text','outline-btn')}${action('Скачать резервную копию','export','outline-btn')}</div><div class="section">${db.notes.length?db.notes.slice().sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).map(n=>`<div class="row-card"><div class="grow"><button class="row-button" data-do="note:${n.id}"><h3>${esc(n.title)}</h3><p>${date(n.updatedAt)} · ${esc(n.body).slice(0,85)}${n.body.length>85?'…':''}</p></button></div><span class="line-label">${ic('arrow')}</span></div>`).join(''):'<div class="empty">Библиотека пуста. Это не ошибка — она будет наполняться тем, что действительно важно.</div>'}</div>`,{title:'Библиотека'})}
function system(){const storage=(()=>{try{localStorage.setItem('__monday_probe','ok');localStorage.removeItem('__monday_probe');return true}catch{return false}})();base(`<div class="header-row"><div><div class="eyebrow">ПРОЗРАЧНОЕ СОСТОЯНИЕ</div><h1>Система</h1></div></div><div class="notice-box"><b>Что работает сейчас</b><div style="margin-top:7px">Диалоги, цели, заметки, события и настройки сохраняются локально. AI-обработка, межустройственная память и платёжная система не подключены.</div></div><div class="section"><div class="section-head"><h2>Внешний вид</h2></div><div class="toggle-row"><div class="grow"><b>Тема</b><p>Стиль всех экранов, без рекламных оболочек</p></div><select class="select" id="themeSelect" aria-label="Тема"><option value="system" ${db.prefs.theme==='system'?'selected':''}>Системная</option><option value="light" ${db.prefs.theme==='light'?'selected':''}>Светлая</option><option value="dark" ${db.prefs.theme==='dark'?'selected':''}>Тёмная</option></select></div><div class="toggle-row"><div class="grow"><b>Тихий режим</b><p>Меньше деталей, без навязчивых уведомлений</p></div><button class="switch ${db.prefs.quiet?'on':''}" data-do="quiet" role="switch" aria-checked="${db.prefs.quiet}" aria-label="Тихий режим"></button></div></div><div class="section"><div class="section-head"><h2>Данные</h2></div><div class="toggle-row"><div class="grow"><b>Локальное хранилище</b><p>${storage?'Доступно':'Недоступно'} · на этом устройстве · без облачной синхронизации</p></div><span class="tag">${storage?'Локально':'Ошибка'}</span></div><div class="toggle-row"><div class="grow"><b>Подключение к MondayID</b><p>Защищённый серверный AI-интерфейс требует отдельной авторизации и разрешения вычислений</p></div><span class="tag">Не подключено</span></div><div class="two-actions">${action(ic('download')+' Экспортировать всё','export')}${action('Импортировать копию','import')}${action('История действий','history')}${action('Тарифная модель','plans')}</div><div class="meta-footer">PWA для Safari, Chrome и компьютера. Нативные приложения iOS/Android не собраны; здесь работают веб-возможности устройства.</div></div>`,{title:'Система'})}
function history(){base(`<div class="header-row"><div><button class="flat-btn" data-nav="system">${ic('left',16)} К системе</button><h2>Линия изменений</h2></div></div><p class="lead">Факты локальных действий, а не имитация внешнего исполнения.</p><div class="timeline">${db.events.length?db.events.map(e=>`<div class="timeline-item">${esc(e.detail)}<small>${date(e.at)} · ${esc(e.provenance||'LOCAL')}</small></div>`).join(''):'<div class="empty">Первые действия появятся здесь после сохранения.</div>'}</div>`,{title:'История',crumb:'Система / События'})}
function plans(){const tiers=[['Free','Интерфейс, локальные данные, история'],['Core','Больше объёмов обработки и подключений'],['Plus','AI-работа с инструментами и файлами'],['Pro','Продолжительные агентные процессы'],['Teams','Роли, общее рабочее пространство'],['Enterprise','Управление, защита, индивидуальная инфраструктура']];base(`<div class="header-row"><div><button class="flat-btn" data-nav="system">${ic('left',16)} К системе</button><h2>Возможности, не украшения</h2></div></div><p class="lead">Ни один тариф Monday пока не продаётся. Это проект будущей продуктовой модели — не предложение оплаты.</p><div class="section">${tiers.map(([name,desc])=>`<div class="row-card"><div class="grow"><h3>${name}</h3><p>${desc}</p></div><span class="line-label">Концепция</span></div>`).join('')}</div>`,{title:'Тарифная модель',crumb:'Система / Тарифы'})}
function render(){if(!$('#app'))return;({'home':home,'chats':chats,'thread':thread,'work':work,'goal':goal,'spaces':spaces,'library':library,'system':system,'history':history,'plans':plans}[view]||home)()}
function openModal(title,body,actionId,label='Сохранить'){$('#modalroot')?.remove();modalAction=actionId;const root=document.createElement('div');root.className='modal-backdrop';root.id='modalroot';root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="icon-btn" data-do="close-modal" aria-label="Закрыть">${ic('close')}</button></div><form id="modalForm" class="modal-body">${body}<div class="actions"><button type="button" class="outline-btn" data-do="close-modal">Отмена</button><button class="send-btn" type="submit">${esc(label)} ${ic('arrow')}</button></div></form></div>`;root.addEventListener('click',e=>{if(e.target===root)closeModal()});document.body.append(root);$('#modalForm input,#modalForm textarea')?.focus()}
function closeModal(){$('#modalroot')?.remove();modalAction=''}
const field=(key,label,placeholder='',value='',type='input')=>`<div class="field"><label for="modal-${key}">${label}</label>${type==='textarea'?`<textarea name="${key}" id="modal-${key}" placeholder="${esc(placeholder)}" maxlength="12000">${esc(value)}</textarea>`:`<input name="${key}" id="modal-${key}" maxlength="300" value="${esc(value)}" placeholder="${esc(placeholder)}">`}</div>`;
function newThread(initial=''){if(initial){const text=initial.trim();if(!text)return;const id=uid(),t={id,title:text.slice(0,70),messages:[{id:uid(),role:'user',text,at:now()}],createdAt:now(),updatedAt:now()};if(update(d=>{d.threads.unshift(t);d.drafts.home=''},'thread-created',`Новый диалог: ${t.title}`)){threadId=id;view='thread';render()}return}openModal('Новый диалог',field('text','Первая мысль','Напиши как есть…','','textarea'),'newthread','Создать')}
function newGoal(){openModal('Новая цель',field('title','Какой эффект должен получиться?','Хочу, чтобы…')+field('criteria','Как узнаем, что результат достигнут?','Проверяемый критерий','','textarea'),'newgoal','Создать цель')}
function newSpace(id){const s=db.spaces.find(x=>x.id===id);openModal(s?'Пространство':'Создать пространство',field('title','Название','Например, MondayID',s?.title||'')+field('description','Описание','',''+(s?.description||''),'textarea'),`space:${id||'new'}`)}
function noteDialog(id){const n=db.notes.find(x=>x.id===id);openModal(n?'Заметка':'Новая заметка',field('title','Название','Короткий заголовок',n?.title||'')+field('body','Содержание','Наблюдение, источник или мысль',n?.body||'','textarea'),`note:${id||'new'}`,n?'Сохранить':'Создать заметку')}
function confirmDelete(kind,id){const names={thread:'диалог',goal:'цель',note:'заметку',space:'пространство'};openModal(`Удалить ${names[kind]}?`,`<p>Это удалит объект с этого устройства. Отмена действия невозможна, если нет резервной копии.</p>`,`delete:${kind}:${id}`,'Удалить')}
function modalSubmit(form){const v=Object.fromEntries(new FormData(form).entries());const a=modalAction;let ok=false;
 if(a==='newthread'){closeModal();newThread(String(v.text||''));return}
 if(a==='newgoal'){const title=String(v.title||'').trim(),criteria=String(v.criteria||'').trim();if(!title)return notify('Нужно название цели');const id=uid();ok=update(d=>{d.goals.unshift({id,title,criteria,steps:[],state:'DRAFT',createdAt:now(),updatedAt:now(),proof:''});d.activeGoal=id},'goal-created',title);if(ok){closeModal();goalId=id;view='goal';render()}return}
 if(a.startsWith('space:')){const id=a.split(':')[1],title=String(v.title||'').trim();if(!title)return notify('Добавь название');ok=update(d=>{const s=d.spaces.find(x=>x.id===id);if(s){s.title=title;s.description=String(v.description||'');s.updatedAt=now()}else d.spaces.unshift({id:uid(),title,description:String(v.description||''),createdAt:now(),updatedAt:now()})},'space-saved',title);if(ok){closeModal();go('spaces')}return}
 if(a.startsWith('note:')){const id=a.split(':')[1],title=String(v.title||'').trim(),body=String(v.body||'');if(!title&&!body.trim())return notify('Заметка пустая');const safeTitle=title||body.slice(0,65);ok=update(d=>{const n=d.notes.find(x=>x.id===id);if(n){n.title=safeTitle;n.body=body;n.updatedAt=now()}else d.notes.unshift({id:uid(),title:safeTitle,body,createdAt:now(),updatedAt:now()})},'note-saved',safeTitle);if(ok){closeModal();go('library')}return}
 if(a.startsWith('delete:')){const [_,kind,id]=a.split(':');const collection={thread:'threads',goal:'goals',note:'notes',space:'spaces'}[kind];ok=update(d=>{d[collection]=d[collection].filter(x=>x.id!==id);if(kind==='goal'&&d.activeGoal===id)d.activeGoal=null},'deleted',`${kind} удалён`);if(ok){closeModal();go(kind==='thread'?'chats':kind==='goal'?'work':kind==='note'?'library':'spaces')}return}
 if(a==='criteria'){const g=currentGoal();ok=update(d=>{const x=d.goals.find(z=>z.id===g.id);x.criteria=String(v.criteria||'');x.updatedAt=now()},'goal-updated',`Обновлён критерий: ${g.title}`);if(ok)closeModal();return}
 if(a==='proof'){const g=currentGoal(),proof=String(v.proof||'').trim();if(!proof)return notify('Запиши, что подтверждает результат');if(g.steps.length&&!g.steps.every(s=>s.done))return notify('Есть незавершённые действия — нельзя подтвердить результат');ok=update(d=>{const x=d.goals.find(z=>z.id===g.id);x.proof=proof;x.state='VERIFIED';x.updatedAt=now()},'user-proof',`Пользователь отметил результат: ${g.title}`);if(ok)closeModal();return}
 if(a==='rename-thread'){const t=db.threads.find(x=>x.id===threadId),title=String(v.title||'').trim();if(!title)return notify('Название не может быть пустым');ok=update(d=>{const x=d.threads.find(z=>z.id===t.id);x.title=title;x.updatedAt=now()},'thread-renamed',title);if(ok)closeModal();return}
}
function onDo(key){if(key==='more')return openModal('Разделы Monday',`<div class="stack"><button type="button" class="outline-btn" data-nav="spaces">Пространства</button><button type="button" class="outline-btn" data-nav="library">Библиотека</button><button type="button" class="outline-btn" data-nav="system">Система и настройки</button></div>`,'noop','Закрыть');if(key==='quick')return openModal('Быстрое действие',`<div class="stack">${[['Новый диалог','newthread'],['Новая цель','newgoal'],['Новая заметка','newnote']].map(([t,k])=>`<button type="button" class="outline-btn" data-do="${k}">${t}</button>`).join('')}</div>`,'noop','Закрыть');if(key==='search')return command();if(key==='close-modal')return closeModal();if(key==='newthread')return newThread();if(key==='newgoal')return newGoal();if(key==='newnote')return noteDialog();if(key==='newspace')return newSpace();if(key==='quiet')return setPref('quiet',!db.prefs.quiet);if(key==='export')return download();if(key==='import')return $('#importPicker').click();if(key==='import-text')return $('#textPicker').click();if(key==='history')return go('history');if(key==='plans')return go('plans');if(key.startsWith('goal:'))return go('goal',key.split(':')[1]);if(key.startsWith('open:')){const [_,kind,id]=key.split(':');return kind==='thread'?go('thread',id):kind==='goal'?go('goal',id):noteDialog(id)}if(key.startsWith('note:'))return noteDialog(key.slice(5));if(key.startsWith('edit-space:'))return newSpace(key.slice(11));if(key==='delete-goal')return confirmDelete('goal',currentGoal().id);if(key==='edit-criteria')return openModal('Критерий результата',field('criteria','Как проверяется завершение?','Действие и доказательство',currentGoal()?.criteria||'','textarea'),'criteria');if(key==='proof')return openModal('Проверка результата',field('proof','Что действительно выполнено и как это проверено?','Опиши наблюдаемое подтверждение','','textarea'),'proof','Подтвердить');if(key==='thread-menu')return openModal('Действия с диалогом',`<div class="stack"><button type="button" class="outline-btn" data-do="rename-thread:${threadId}">Переименовать</button><button type="button" class="outline-btn danger" data-do="delete-thread:${threadId}">Удалить диалог</button></div>`,'noop','Закрыть');if(key.startsWith('delete-thread:'))return confirmDelete('thread',key.slice(14));if(key.startsWith('rename-thread:')){const t=db.threads.find(x=>x.id===key.slice(14));if(!t)return;threadId=t.id;return openModal('Переименовать диалог',field('title','Название','',''+t.title),'rename-thread')}if(key.startsWith('remove-step:')){const g=currentGoal(),sid=key.slice(12);if(!g)return;return update(d=>{const x=d.goals.find(z=>z.id===g.id);x.steps=x.steps.filter(s=>s.id!==sid);x.state='ACTIVE';x.proof='';x.updatedAt=now()},'step-removed',`Удалено действие из ${g.title}`)}if(key==='why-no-ai')return openModal('Честный статус AI','<p>Этот интерфейс сохраняет твои мысли и рабочие состояния. Он не подключён к платной модели или защищённому MondayID API. Никаких выдуманных ответов.</p><p>Подключение возможно после серверной авторизации и проверки. Ключи нельзя вводить в общедоступный браузер.</p>','noop','Закрыть');if(key==='noop')return closeModal();if(key.startsWith('voice-'))return dictate(key.slice(6));}
function command(q=''){commandQuery=q;const list=latest().filter(o=>(o.title||'').toLowerCase().includes(q.toLowerCase())).slice(0,8);const commands=[['Новый диалог','newthread'],['Новая цель','newgoal'],['Новая заметка','newnote'],['Резервная копия','export']];const content=`<input class="command-input" id="commandQuery" placeholder="Поиск и команды…" value="${esc(q)}" aria-label="Поиск">${commands.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())||!q).map(([label,k])=>`<button type="button" class="command-result" data-do="${k}">${esc(label)}</button>`).join('')}${list.map(o=>`<button type="button" class="command-result" data-do="open:${o.kind}:${o.id}">${esc(o.title)} <span class="line-label">· ${o.kind}</span></button>`).join('')}${!list.length&&q?'<p class="subtle-note">Нет совпадений.</p>':''}`;openModal('Найти или начать',content,'noop','Готово');$('#commandQuery')?.focus()}
function dictate(target){const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec)return notify('Диктовка недоступна в этом браузере');try{const rec=new Rec();rec.lang='ru-RU';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{const text=e.results[0][0].transcript;const el=$(target==='home'?'#homeDraft':'#chatDraft');if(el){el.value=[el.value,text].filter(Boolean).join(' ');el.dispatchEvent(new Event('input',{bubbles:true}));notify('Текст готов. Отправка — только по твоему нажатию.')}};rec.onerror=()=>notify('Не получилось распознать речь');rec.start();notify('Слушаю…')}catch{notify('Диктовка сейчас недоступна')}}
function download(){const payload=JSON.stringify({schema:'monday.surface.backup.v1',exportedAt:now(),data:db},null,2);const blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='monday-continuity-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);notify('Копия подготовлена')}
function importBackup(input){if(!input||typeof input!=='object')throw Error('Неверный формат');let d;if(input.schema==='monday.surface.backup.v1'&&valid(input.data)){d=input.data}else if(input.schema===LEGACY&&Array.isArray(input.threads)){d=blank();d.threads=input.threads.map(t=>({id:t.id||uid(),title:String(t.title||'Диалог'),messages:Array.isArray(t.messages)?t.messages.map(m=>({id:m.id||uid(),role:m.role==='monday'?'system':'user',text:String(m.text||''),at:m.at||now()})):[],createdAt:t.createdAt||now(),updatedAt:t.updatedAt||now()}));d.goals=(input.tasks||[]).map(t=>({id:t.id||uid(),title:String(t.title||'Задача'),criteria:'',steps:(t.checkpoints||[]).map(c=>({id:c.id||uid(),text:String(c.title||''),done:!!c.done})),state:t.done?'ACTIVE':'DRAFT',proof:'',createdAt:t.createdAt||now(),updatedAt:t.updatedAt||now()}));d.notes=(input.notes||[]).map(n=>({id:n.id||uid(),title:String(n.title||'Заметка'),body:String(n.body||''),createdAt:n.createdAt||now(),updatedAt:n.updatedAt||now()}));d.spaces=(input.spaces||[]).map(s=>({id:s.id||uid(),title:String(s.title||'Пространство'),description:String(s.description||''),createdAt:s.createdAt||now(),updatedAt:s.updatedAt||now()}));}else throw Error('Эта версия копии не поддерживается');if([d.threads,d.goals,d.notes,d.spaces].some(x=>x.length>5000))throw Error('Копия слишком большая');for(const t of d.threads)if(!Array.isArray(t.messages)||t.messages.length>3000)throw Error('Некорректный диалог');return d}
function importFile(file){if(!file||file.size>3e6)return notify('Файл JSON слишком большой (максимум 3 МБ)');file.text().then(raw=>{let incoming=importBackup(JSON.parse(raw));const ok=update(d=>{const ids=new Set([...d.threads,...d.goals,...d.notes,...d.spaces].map(x=>x.id));for(const c of ['threads','goals','notes','spaces'])for(const x of incoming[c])if(!ids.has(x.id)){d[c].push(x);ids.add(x.id)}},'import',`Импортирована резервная копия`);if(ok){go('home');notify('Объекты импортированы, существующие сохранены')}}).catch(e=>notify('Импорт отклонён: '+String(e.message||e)))}
function textFile(file){if(!file||file.size>200000)return notify('Текстовый файл должен быть меньше 200 КБ');file.text().then(body=>{const title=file.name.slice(0,150);const ok=update(d=>d.notes.unshift({id:uid(),title,body,createdAt:now(),updatedAt:now()}),'text-import',title);if(ok){go('library');notify('Текст добавлен локально')}}).catch(()=>notify('Файл не прочитан'))}
document.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){if(navEl.dataset.nav==='more'){onDo('more');return}go(navEl.dataset.nav);closeModal();return}const open=e.target.closest('[data-open-thread]');if(open){threadId=open.dataset.openThread;go('thread',threadId);return}const act=e.target.closest('[data-do]');if(act){e.preventDefault();onDo(act.dataset.do)}});
document.addEventListener('submit',e=>{const form=e.target;if(form.id==='modalForm'){e.preventDefault();modalSubmit(form);return}if(!form.dataset.form)return;e.preventDefault();const type=form.dataset.form,text=String(new FormData(form).get('text')||'').trim();if(!text)return notify('Напиши хотя бы одну мысль');if(type==='new-thread'){newThread(text);return}if(type==='message'){const id=threadId;const ok=update(d=>{const t=d.threads.find(x=>x.id===id);if(!t)throw Error('Диалог не найден');t.messages.push({id:uid(),role:'user',text,at:now()});t.updatedAt=now();d.drafts.chat=''},'message-saved','Сохранено сообщение пользователя');if(ok)notify('Мысль сохранена локально');return}if(type==='step'){const g=currentGoal();if(!g)return;update(d=>{const x=d.goals.find(z=>z.id===g.id);x.steps.push({id:uid(),text,done:false});x.state='ACTIVE';x.proof='';x.updatedAt=now()},'step-added',`Добавлено действие для ${g.title}`);return}});
document.addEventListener('change',e=>{if(e.target.id==='themeSelect')setPref('theme',e.target.value);if(e.target.dataset.step){const g=currentGoal(),id=e.target.dataset.step;if(!g)return;update(d=>{const x=d.goals.find(z=>z.id===g.id),s=x.steps.find(s=>s.id===id);if(s)s.done=e.target.checked;x.state='ACTIVE';x.proof='';x.updatedAt=now()},'step-changed',`Статус действия в ${g.title}`)}if(e.target.id==='importPicker'){importFile(e.target.files[0]);e.target.value=''}if(e.target.id==='textPicker'){textFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='homeDraft'||e.target.id==='chatDraft'){const key=e.target.id==='homeDraft'?'home':'chat';try{const next=structuredClone(db);next.drafts[key]=e.target.value;localStorage.setItem(KEY,JSON.stringify(next));db=next}catch{saveError=true;notify('Черновик не сохранился — проверь память браузера')}}if(e.target.id==='threadSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-thread-title]').forEach(el=>{el.style.display=el.dataset.threadTitle.includes(q)?'':'none'})}if(e.target.id==='commandQuery'){commandQuery=e.target.value;const val=e.target.value;const f=document.activeElement;/* keep current text during live query; submit via Enter */}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();newThread();return}if(e.key==='Escape'&&$('#modalroot')){closeModal();return}if(e.key==='Enter'&&!e.shiftKey&&(e.target.id==='chatDraft'||e.target.id==='homeDraft')){e.preventDefault();e.target.closest('form')?.requestSubmit()}if(e.key==='Enter'&&e.target.id==='commandQuery'){e.preventDefault();const q=e.target.value.trim();if(q) {closeModal();const match=latest().find(o=>o.title.toLowerCase().includes(q.toLowerCase()));if(match)onDo(`open:${match.kind}:${match.id}`);else notify('Ничего не найдено')}}});
window.addEventListener('storage',e=>{if(e.key===KEY){try{const x=JSON.parse(e.newValue);if(valid(x)){db=x;render();notify('Обновлено в другой вкладке')}}catch{}}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();

</script></body></html>
