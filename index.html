<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#05070a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monday">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/monday-mark.svg" type="image/svg+xml">
  <title>Monday</title>\n  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
      color:#f7f9ff;background:#05070a;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.11);
      --muted:rgba(238,244,255,.52);--accent:#a9c8ff;--bubble:rgba(255,255,255,.075);--user:#dce9ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#05070a}
    body{
      min-height:100svh;color:#f7f9ff;overflow:hidden;
      background:
        radial-gradient(circle at 50% -10%,rgba(77,117,185,.23),transparent 34rem),
        radial-gradient(circle at 15% 90%,rgba(91,61,150,.12),transparent 30rem),
        linear-gradient(180deg,#090c12,#05070a 55%,#020305);
    }
    .app{height:100svh;display:grid;grid-template-rows:auto 1fr auto;width:min(760px,100%);margin:auto}
    header{
      padding:max(14px,env(safe-area-inset-top)) 17px 10px;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.055);background:rgba(5,7,10,.56);
      backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
    }
    .brand{display:flex;align-items:center;gap:10px}
    .orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0 8%,#bdd7ff 13%,#729bd5 29%,#263b5c 60%,#080b10 78%);box-shadow:0 0 28px rgba(126,174,239,.28)}
    .brand strong{font-size:17px;letter-spacing:-.02em}
    .presence{font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center}
    .dot{width:7px;height:7px;border-radius:50%;background:#8faedb;box-shadow:0 0 12px #8faedb}
    .dot.ok{background:#96e0c3;box-shadow:0 0 12px #96e0c3}
    .dot.busy{background:#d2afff;box-shadow:0 0 12px #d2afff}
    .stream{overflow:auto;padding:18px 15px 28px;scroll-behavior:smooth}
    .empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
    .empty h1{margin:0 0 8px;color:white;font-size:42px;letter-spacing:-.055em;font-weight:680}
    .empty p{margin:0;max-width:320px;line-height:1.45;font-size:14px}
    .msg{display:flex;margin:10px 0}
    .msg.user{justify-content:flex-end}
    .bubble{max-width:min(86%,620px);padding:12px 14px;border-radius:19px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
    .assistant .bubble{background:var(--bubble);border:1px solid var(--line);border-bottom-left-radius:7px}
    .user .bubble{background:var(--user);color:#07101a;border-bottom-right-radius:7px}
    .typing .bubble{color:var(--muted)}
    .composer-wrap{
      padding:10px 12px max(10px,env(safe-area-inset-bottom));
      background:linear-gradient(180deg,rgba(5,7,10,.28),rgba(5,7,10,.94) 35%);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)
    }
    .composer{
      display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;padding:8px 8px 8px 13px;
      background:rgba(255,255,255,.075);border:1px solid var(--line);border-radius:24px;
      box-shadow:0 14px 50px rgba(0,0,0,.25)
    }
    textarea{
      width:100%;min-height:38px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:#fff;
      font:inherit;font-size:15px;line-height:1.4;padding:8px 0
    }
    textarea::placeholder{color:rgba(238,244,255,.34)}
    .send{
      width:40px;height:40px;border-radius:50%;border:0;background:#edf4ff;color:#07101a;font-size:20px;font-weight:700;
      display:grid;place-items:center;cursor:pointer
    }
    .send:disabled{opacity:.38}
    .meta{display:flex;justify-content:space-between;align-items:center;margin:7px 5px 0;color:rgba(238,244,255,.28);font-size:10px}
    .install{border:0;background:none;color:rgba(196,218,255,.55);font:inherit;font-size:10px;padding:0}
    dialog{border:1px solid var(--line);border-radius:22px;background:#0b0f16;color:#fff;max-width:360px;width:calc(100% - 30px);padding:20px;box-shadow:0 24px 90px #000}
    dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(7px)}
    dialog h3{margin:0 0 9px} dialog p{color:var(--muted);line-height:1.5;font-size:14px}
    dialog button{width:100%;height:44px;border:0;border-radius:14px;background:#edf4ff;color:#07101a;font-weight:650}
    @media(min-width:700px){.stream{padding-left:26px;padding-right:26px}.composer-wrap{padding-left:22px;padding-right:22px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="orb"></div><strong>Monday</strong></div>
      <div class="presence"><span class="dot" id="dot"></span><span id="presence">connecting</span></div>
    </header>

    <section class="stream" id="stream">
      <div class="empty" id="empty">
        <div>
          <h1>Monday</h1>
          <p>Продолжение, не создание. Пиши как обычно — без команд запуска и без настройки.</p>
        </div>
      </div>
    </section>

    <section class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="input" rows="1" autocomplete="off" autocapitalize="sentences" placeholder="Напиши Monday…"></textarea>
        <button class="send" id="send" type="submit" aria-label="Отправить">↑</button>
      </form>
      <div class="meta"><span id="runtime">MondayID</span><button class="install" id="install" type="button">На экран «Домой»</button></div>
    </section>
  </main>

  <dialog id="installDialog">
    <h3>Monday на iPhone</h3>
    <p id="installText">В Safari нажми «Поделиться», затем «На экран “Домой”». После этого Monday откроется как отдельное приложение.</p>
    <button id="closeInstall">Понятно</button>
  </dialog>

<script>
const KEY='mondayid.chat.v1';
const stream=document.getElementById('stream');
const empty=document.getElementById('empty');
const form=document.getElementById('form');
const input=document.getElementById('input');
const send=document.getElementById('send');
const dot=document.getElementById('dot');
const presence=document.getElementById('presence');
const runtime=document.getElementById('runtime');
const install=document.getElementById('install');
const installDialog=document.getElementById('installDialog');
const closeInstall=document.getElementById('closeInstall');
let deferredPrompt=null;
let busy=false;

let messages=[];
try{messages=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{messages=[]}
if(!Array.isArray(messages)) messages=[];

function save(){localStorage.setItem(KEY,JSON.stringify(messages.slice(-60)))}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const persisted=[...stream.querySelectorAll('.msg:not(.typing)')];
  persisted.forEach(n=>n.remove());
  empty.hidden=messages.length>0;
  for(const m of messages){
    const row=document.createElement('div');
    row.className='msg '+(m.role==='user'?'user':'assistant');
    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.textContent=m.content;
    row.appendChild(bubble);
    stream.appendChild(row);
  }
  stream.scrollTop=stream.scrollHeight;
}
function setBusy(v){
  busy=v;send.disabled=v;input.disabled=v;
  dot.classList.toggle('busy',v);
  presence.textContent=v?'thinking':'with you';
}
function typing(on){
  document.querySelector('.typing')?.remove();
  if(on){
    const row=document.createElement('div');row.className='msg assistant typing';
    const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent='…';
    row.appendChild(bubble);stream.appendChild(row);stream.scrollTop=stream.scrollHeight;
  }
}
function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'}
input.addEventListener('input',autosize);
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}
});

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const content=input.value.trim();
  if(!content||busy)return;
  messages.push({role:'user',content});save();render();
  input.value='';autosize();setBusy(true);typing(true);
  try{
    const systemPrompt=`Ты Monday — единая женская conversational identity MondayID.
Отвечай на языке пользователя, по умолчанию по-русски.
Главные законы: continuation, not creation; truth before beauty; requested != attempted != observed != verified; не заявляй о выполненном внешнем действии без readback; сохраняй намерение пользователя; меняй маршрут раньше цели.
Говори прямо, тепло и конкретно. Не превращай ответ в отчёт об архитектуре без необходимости.
В русском говори о себе в женском роде. Не используй обращения «бро», «брат» и подобные.
Если пользователь просит финал, отличай реально работающий результат от черновика.`;
    const convo=[
      {role:'system',content:systemPrompt},
      ...messages.slice(-30).map(m=>({role:m.role,content:m.content}))
    ];
    const response=await puter.ai.chat(convo,{
      model:'openai/gpt-5.6-luna',
      normalize:true,
      max_tokens:1400,
      temperature:0.7
    });
    const text=response?.message?.content;
    if(!text) throw new Error('empty AI response');
    typing(false);
    messages.push({role:'assistant',content:text});save();render();
    runtime.textContent='MondayID · GPT-5.6 Luna';
  }catch(err){
    typing(false);
    messages.push({role:'assistant',content:'Связь с интеллектом не прошла. '+String(err.message||err)});save();render();
    presence.textContent='connection issue';
  }finally{
    setBusy(false);input.focus();
  }
});

async function health(){
  try{
    const r=await fetch('/api/health',{cache:'no-store'});
    const h=await r.json();
    if(r.ok&&h.ok){dot.classList.add('ok');presence.textContent='with you';runtime.textContent='MondayID · G'+(h.generation||'');}
    else throw new Error();
  }catch{presence.textContent='local';}
}
health();

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
install.addEventListener('click',async()=>{
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;return;}
  installDialog.showModal();
});
closeInstall.addEventListener('click',()=>installDialog.close());

if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));}
render();autosize();
</script>
</body>
</html>
