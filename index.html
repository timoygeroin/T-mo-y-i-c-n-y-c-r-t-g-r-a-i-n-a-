<style>

main{max-width:760px;margin:auto}h1{font-weight:670;letter-spacing:-.045em;font-size:clamp(34px,8vw,54px);line-height:1.08;margin:12px 0}h2{font-size:19px;letter-spacing:-.02em;margin:0 0 12px}h3{font-size:16px;margin:0}p{margin:8px 0;line-height:1.5}

.card{padding:16px 18px;margin:10px 0}.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.item .grow{flex:1;min-width:0}.item-title{font-weight:620;overflow-wrap:anywhere}.item-sub{font-size:12px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.item-actions{display:flex;gap:4px;flex-shrink:0}

.feed{margin-top:12px}.feed .card{cursor:pointer}.feed .card:hover{border-color:rgba(178,207,255,.35)}

.narrow{max-width:620px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stretch{flex:1}.hint{font-size:12px;line-height:1.45;color:var(--muted)}
.bottomnav{position:fixed;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(8,12,21,.88);border-top:1px solid var(--line);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);z-index:4}

.bubble.from-monday{align-self:flex-start;background:rgba(198,210,255,.10);border-radius:17px 17px 17px 5px}\n.timeline{border-left:1px solid var(--line);margin-left:9px;padding-left:19px}.timeline .card{position:relative}.timeline .card:before{content:"";width:7px;height:7px;background:#9dbdff;border-radius:50%;position:absolute;left:-23px;top:20px}
#toast{position:fixed;bottom:calc(93px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90%;background:#e5eeff;color:#13213a;padding:11px 15px;border-radius:13px;z-index:12;box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:12px;display:none}
#toast.show{display:block}
code{font-size:12px}a{color:#bdd3ff}
@media(min-width:700px){.hero{padding:35px}.grid{grid-template-columns:repeat(4,1fr)}.sheet{align-self:center;border-radius:25px}.navinner{max-width:600px}}

.deus-link{display:inline-block;text-decoration:none;margin-top:9px;min-height:43px}

<body>
<div id="app">
<header><div class="brand">Monday<small>YOUR CONTINUUM</small></div><div class="header-actions"><button class="iconbtn" id="searchBtn" aria-label="Search">⌕</button><button class="iconbtn" id="activityBtn" aria-label="Activity">◷</button></div></header>
<main id="view" aria-live="polite"></main>
</div>
<nav class="bottomnav" aria-label="Primary"><div class="navinner" id="nav">
<button data-tab="home"><b>⌂</b>Home</button><button data-tab="chats"><b>☰</b>Chats</button><button data-tab="create"><b>＋</b>Create</button><button data-tab="spaces"><b>◈</b>Spaces</button><button data-tab="you"><b>◯</b>You</button>
</div></nav><div id="modals"></div><div id="toast" role="status" aria-live="polite"></div><input hidden id="importFile" type="file" accept=".json,application/json">
<script>
'use strict';
const KEY='monday.continuum.local.v1', VERSION=1;
const MONDAY_SHORTCUT='MONDAYID — REENTRY', BRIDGE_PENDING='monday.shortcut.pending.v1';
// Only the model instructions are copied. The user adds the native Shortcut Input
// magic variable manually in the Shortcuts editor; prose cannot create an iOS action.
const SHORTCUT_RECIPE='You are Monday, a helpful and truthful personal assistant. The user input contains recent conversation followed by a current message. Respond to the current message in the same language. Use the supplied context only as evidence; do not invent memories or claim an external action was performed without verification. Return only the answer.\n\nConversation and current message: ';
const SHORTCUT_MANUAL_GUIDE=[
'1. Open the regular Shortcuts action editor, NOT Describe a Shortcut. On iOS 27, Settings → Apps → Shortcuts → Open Shortcuts To → Editor can change the default.',
'2. Name the shortcut exactly MONDAYID — REENTRY (including the long dash).',
'3. Add one action from Apple Intelligence → Use Model. Choose On-Device and turn Follow Up off.',
'4. Paste the copied Monday prompt into the Use Model prompt field. At the end insert the blue Shortcut Input magic variable (do not just type its name).',
'5. The final Use Model action outputs the response automatically. Stop and Output is NOT needed. Test with a short input first.',
'6. Return to Monday → Chats and use Ask Monday; the existing x-callback-url bridge will receive the text.'
].join('\n');
const blank=()=>({schema:'monday.continuum.local.v1',version:VERSION,createdAt:new Date().toISOString(),threads:[],notes:[],tasks:[],spaces:[],events:[]});
let data;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');data=valid(raw)?raw:blank();}catch{data=blank();}
let tab='home',mode='note',activeThread=null,searchText='',editId=null,toastHandle=null;
let persistedSnapshot=JSON.stringify(data),lastSaveOk=true;
const $=id=>document.getElementById(id);
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'m-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const date=s=>{try{return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return 'unknown'}};
const mk=(tag,className,textValue)=>{const e=document.createElement(tag);if(className)e.className=className;if(textValue!==undefined)e.textContent=String(textValue);return e;};
const append=(parent,...kids)=>{for(const child of kids)if(child)parent.appendChild(child);return parent};
const act=(label,fn,cls='secondary')=>{const b=mk('button',cls,label);b.type='button';b.addEventListener('click',fn);return b};
const empty=(label)=>mk('div','empty',label);
function valid(value){if(!value||value.schema!=='monday.continuum.local.v1'||value.version!==1||!['threads','notes','tasks','spaces','events'].every(k=>Array.isArray(value[k])))return false;const sized=k=>value[k].length<=5000&&value[k].every(x=>x&&typeof x.id==='string'&&x.id.length<200);if(!['threads','notes','tasks','spaces','events'].every(sized))return false;return value.threads.every(t=>typeof t.title==='string'&&t.title.length<500&&Array.isArray(t.messages)&&t.messages.length<=3000&&t.messages.every(m=>m&&typeof m.text==='string'&&m.text.length<=12000))&&value.notes.every(n=>typeof n.title==='string'&&typeof n.body==='string'&&n.body.length<=12000)&&value.tasks.every(t=>typeof t.title==='string'&&Array.isArray(t.checkpoints)&&t.checkpoints.length<=2000&&t.checkpoints.every(c=>c&&typeof c.title==='string'&&typeof c.done==='boolean'))&&value.spaces.every(t=>typeof t.title==='string'&&typeof t.description==='string');}
function persist(){
  try{
    const next=JSON.stringify(data);
    localStorage.setItem(KEY,next);
    persistedSnapshot=next;
    lastSaveOk=true;
    return true;
  }catch{
    // A failed browser write must never become a fictitious saved event or a lost edit on reload.
    data=JSON.parse(persistedSnapshot);
    lastSaveOk=false;
    toast('Not saved: browser storage failed. Previous saved data was restored.');
    return false;
  }
}
function event(action,kind,objectId,detail){data.events.unshift({id:id(),at:now(),action,kind,objectId,detail:detail||'',state:'PERSISTED_LOCALLY'});data.events=data.events.slice(0,300);}
function save(kind,object,action='created'){data[kind].unshift(object);event(action,kind,object.id,object.title);const ok=persist();render();return ok;}
function toast(msg){if(!lastSaveOk&&/\b(saved|restored|cleared|deleted|completed)\b/i.test(msg))msg='Not saved: browser storage failed. Previous saved data was restored.';const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.remove('show'),3800);}
function heading(kicker,title,subtitle){const box=mk('section');append(box,mk('div','eyebrow',kicker),mk('h1','',title));if(subtitle)append(box,mk('p','muted',subtitle));return box}
function section(title,caption){const bar=mk('div','sectionbar');append(bar,mk('h2','',title));if(caption)append(bar,mk('span','small muted',caption));return bar}
function card(title,sub,right,onClick){const c=mk('div','glass card item'),g=mk('div','grow');append(g,mk('div','item-title',title),mk('div','item-sub',sub));append(c,g);if(right)append(c,right);if(onClick){c.style.cursor='pointer';c.tabIndex=0;c.setAttribute('role','button');c.addEventListener('click',onClick);c.addEventListener('keydown',e=>{if(e.key==='Enter')onClick()})}return c;}
function navTo(name){tab=name;activeThread=null;searchText='';render();window.scrollTo(0,0)}
function render(){const view=$('view');view.replaceChildren();$('nav').querySelectorAll('button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(activeThread){drawThread(view,activeThread);return}({home:drawHome,chats:drawChats,create:drawCreate,spaces:drawSpaces,you:drawYou,search:drawSearch,activity:drawActivity,library:drawLibrary}[tab]||drawHome)(view);}
function quickCapture(text,kind){const t=text.trim();if(!t){toast('Write something first');return;}if(t.length>12000){toast('Keep each entry under 12,000 characters');return;}
if(kind==='note'){if(!save('notes',{id:id(),title:t.slice(0,64),body:t,spaceId:null,createdAt:now(),updatedAt:now()},'captured'))return;}
else if(kind==='task'){if(!save('tasks',{id:id(),title:t,done:false,checkpoints:[],createdAt:now(),updatedAt:now()},'opened'))return;}
else{const thread={id:id(),title:t.slice(0,68),messages:[{id:id(),role:'user',text:t,at:now()}],createdAt:now(),updatedAt:now()};if(!save('threads',thread,'started'))return;activeThread=thread.id;render();}
toast('Saved on this device — not sent to a model');}
function drawHome(view){append(view,heading('Welcome to your space','Your world, in one place.','Capture an idea, continue a thread, or move your work forward. Your content is not sent to an AI model. This local edition does not run AI inference.'));
const hero=mk('section','glass hero');append(hero,mk('div','eyebrow','Continuum'),mk('h2','','What matters right now?'));
const seg=mk('div','segment');[['note','Note'],['task','Task'],['thread','Thread']].forEach(([key,label])=>{const b=act(label,()=>{mode=key;render()},mode===key?'active':'');seg.appendChild(b)});append(hero,seg);
const form=mk('form','composer'),inp=mk('input');inp.name='capture';inp.placeholder=mode==='task'?'Something to accomplish…':mode==='thread'?'Start a private thread…':'A thought worth keeping…';inp.setAttribute('aria-label','Capture your thought');const send=mk('button','primary','Save');send.type='submit';append(form,inp,send);form.addEventListener('submit',e=>{e.preventDefault();quickCapture(inp.value,mode)});append(hero,form,mk('p','hint','Local-first. Your data stays in this browser until you export it.'));append(view,hero);
const deus=mk('section','glass card');append(deus,mk('div','eyebrow','MONDAY WORK / DEUS-0'),mk('h2','','Explore possible futures'),mk('p','muted','A bounded model of alternative paths. Real-world action and AI inference are not implied.'));const deusLink=mk('a','primary deus-link','Open DEUS-0 World Lab');deusLink.href='/deus0';append(deus,deusLink);append(view,deus);
append(view,section('Your continuum','Right where you left off'));const stats=mk('div','grid');[['Threads',data.threads.length,'chats'],['Open tasks',data.tasks.filter(x=>!x.done).length,'create'],['Notes',data.notes.length,'library'],['Spaces',data.spaces.length,'spaces']].forEach(([name,num,dest])=>{const c=mk('button','glass tile');append(c,mk('span','',name),mk('strong','',num),mk('span','','Open →'));c.addEventListener('click',()=>navTo(dest));stats.appendChild(c)});append(view,stats);
const all=[...data.threads.map(x=>({...x,kind:'thread'})),...data.notes.map(x=>({...x,kind:'note'})),...data.tasks.map(x=>({...x,kind:'task'}))].sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0,7);
append(view,section('Recently touched',all.length+' objects'));if(!all.length)append(view,empty('No history yet. Begin with one meaningful thought.'));else all.forEach(x=>append(view,card(x.title,(x.kind==='task'?(x.done?'Completed':'Open')+' · ':'')+x.kind+' · '+date(x.updatedAt),null,()=>openObject(x.kind,x.id))));
}
function openObject(kind,objectId){if(kind==='thread'){activeThread=objectId;tab='chats';render();return;}if(kind==='note'){openNote(objectId);return;}if(kind==='task')openTask(objectId);}
function drawChats(view){append(view,heading('Private threads','Chats','Thread history you control. This local edition stores your messages but does not impersonate an AI assistant.'));
append(view,section('Your threads'));append(view,act('＋ New thread',()=>openNewThread(),'primary'));const threads=[...data.threads].sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));if(!threads.length)append(view,empty('No threads yet. Make one to keep a line of thought together.'));threads.forEach(x=>append(view,card(x.title,x.messages.length+' messages · '+date(x.updatedAt),mk('span','pill','Local'),()=>{activeThread=x.id;render()})));}
function openNewThread(){const box=mk('div');const field=mk('div','field');append(field,mk('label','','First thought'));const input=mk('textarea');input.placeholder='What is on your mind?';field.appendChild(input);append(box,field);modal('Start a thread',box,[act('Create',()=>{const t=input.value.trim();if(!t)return toast('A thread starts with a thought');closeModal();quickCapture(t,'thread')},'primary')]);input.focus();}
function drawThread(view,threadId){const thread=data.threads.find(x=>x.id===threadId);if(!thread){activeThread=null;render();return}
append(view,act('← All threads',()=>{activeThread=null;render()},'textbtn'),heading('Local conversation',thread.title,'Messages are saved only on this device. There are no generated AI replies.'));
const msgs=mk('div','messages glass');msgs.style.padding='16px';if(!thread.messages.length)append(msgs,empty('No messages'));thread.messages.forEach(m=>append(msgs,mk('div',m.role==='monday'?'bubble from-monday':'bubble',m.text)));append(view,msgs);
const form=mk('form','composer spaced'),input=mk('input');input.placeholder='Continue your thought…';input.setAttribute('aria-label','New message');const b=mk('button','primary','Keep');b.type='submit';const ask=mk('button','secondary','Ask Monday');ask.type='button';ask.addEventListener('click',()=>askShortcuts(thread,input.value));append(form,input,b,ask);form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;if(text.length>12000)return toast('Message too long');const current=data.threads.find(x=>x.id===threadId);if(!current)return toast('Thread no longer exists');current.messages.push({id:id(),role:'user',text,at:now()});current.updatedAt=now();event('message_saved','threads',current.id,'User-supplied text');if(!persist())return;render()});append(view,form);
const row=mk('div','row spaced');append(row,act('Copy portable context',()=>copyThread(thread),'secondary'),act('Delete thread',()=>removeObject('threads',thread.id),'danger'));append(view,row);}
async function copyShortcutRecipe(){
  try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(SHORTCUT_RECIPE);toast('Monday model prompt copied. Paste into Use Model, then insert Shortcut Input.');}
  catch{const field=mk('textarea');field.value=SHORTCUT_RECIPE;field.readOnly=true;const box=mk('div','field');append(box,field);modal('Monday model prompt',box,[act('Close',closeModal)]);field.focus();field.select();}
}
function bridgeSetup(){
  const box=mk('section');
  append(box,mk('p','muted','The iOS 27 Describe a Shortcut generator may fail to locate real Apple actions. Use the built-in manual Editor: only ONE Use Model action is needed.'));
  const steps=mk('p','hint',SHORTCUT_MANUAL_GUIDE);steps.style.whiteSpace='pre-line';steps.style.lineHeight='1.7';append(box,steps);
  append(box,act('1 · Copy Monday model prompt',copyShortcutRecipe,'primary'),act('2 · Open Shortcuts editor',()=>{window.location.href='shortcuts://create-shortcut'},'secondary'));
  append(box,mk('p','hint','If the action is not listed under Apple Intelligence, first check Settings → Apple Intelligence & Siri. Device and Siri languages must be supported. The Shortcuts app language alone does not prove model availability.'));
  append(box,mk('p','hint','After saving MONDAYID — REENTRY, return to Chats and tap Ask Monday. Actual model execution requires a test on this iPhone.'));
  modal('Connect Apple Intelligence',box,[act('Close',closeModal)]);
}
function askShortcuts(thread,raw){
  const value=String(raw||'').trim();
  if(!value)return toast('Write a message first');
  if(value.length>12000)return toast('Message is too long');
  const requestId=id();
  // Browser-local proof of the pending request, not a server credential.
  try{localStorage.setItem(BRIDGE_PENDING,JSON.stringify({requestId,threadId:thread.id,createdAt:Date.now()}))}
  catch{return toast('Local storage is unavailable. Export your data first.')}
  thread.messages.push({id:id(),role:'user',text:value,at:now()});
  thread.updatedAt=now();event('shortcut_sent','threads',thread.id,'Sent through Apple Shortcuts; awaiting a local callback');persist();render();
  const prior=thread.messages.slice(-9,-1).map(m=>(m.role==='user'?'User: ':'Monday: ')+m.text.slice(0,400)).join('\n');
  const capsule=('Previous conversation:\n'+prior+'\n\nCurrent message:\n'+value).slice(-3500);
  const target=new URL(location.pathname,location.origin);
  target.searchParams.set('mondayCallback','ok');target.searchParams.set('requestId',requestId);
  const failure=new URL(location.pathname,location.origin);
  failure.searchParams.set('mondayCallback','error');failure.searchParams.set('requestId',requestId);
  const cancel=new URL(location.pathname,location.origin);
  cancel.searchParams.set('mondayCallback','cancel');cancel.searchParams.set('requestId',requestId);
  const link='shortcuts://x-callback-url/run-shortcut?name='+encodeURIComponent(MONDAY_SHORTCUT)+
    '&input=text&text='+encodeURIComponent(capsule)+
    '&x-success='+encodeURIComponent(target.href)+
    '&x-error='+encodeURIComponent(failure.href)+
    '&x-cancel='+encodeURIComponent(cancel.href);
  window.location.href=link;
}
function receiveShortcutCallback(){
  const params=new URLSearchParams(location.search),state=params.get('mondayCallback');
  if(!state)return;
  const clean=()=>history.replaceState({},'',location.pathname+location.hash);
  let pending;try{pending=JSON.parse(localStorage.getItem(BRIDGE_PENDING)||'null')}catch{pending=null}
  if(!pending||pending.requestId!==params.get('requestId')||Date.now()-pending.createdAt>20*60*1000){
    clean();toast('Unmatched or expired Shortcuts callback');return;
  }
  localStorage.removeItem(BRIDGE_PENDING);
  const thread=data.threads.find(t=>t.id===pending.threadId);
  clean();
  const result=params.get('result');
  if(state==='ok'&&thread&&result&&result.trim()&&result.length<=12000){
    thread.messages.push({id:id(),role:'monday',text:result.trim(),at:now()});
    thread.updatedAt=now();event('shortcut_reply','threads',thread.id,'Result returned from Apple Shortcuts; not independently verified model provenance');
    persist();tab='chats';activeThread=thread.id;render();toast('Shortcuts returned a reply');
  } else {
    const error=(params.get('errorMessage')||'').slice(0,240);
    toast(state==='cancel'?'Shortcut canceled':state==='error'?'Shortcut failed: '+(error||'No details'):'No usable answer returned');
  }
}

function drawSearch(view){append(view,heading('Find anything','Search','Search your local threads, notes, tasks and spaces.'));const field=mk('div','field'),inp=mk('input');inp.placeholder='Search your world…';inp.value=searchText;inp.setAttribute('aria-label','Search local content');append(field,inp);append(view,field);const results=mk('div');append(view,results);function lookup(){searchText=inp.value;results.replaceChildren();const q=searchText.trim().toLocaleLowerCase();if(!q){append(results,empty('Enter a word or phrase.'));return}const items=[...data.notes.map(x=>({...x,kind:'note',words:x.title+' '+x.body})),...data.tasks.map(x=>({...x,kind:'task',words:x.title})),...data.spaces.map(x=>({...x,kind:'space',words:x.title+' '+x.description})),...data.threads.map(x=>({...x,kind:'thread',words:x.title+' '+x.messages.map(m=>m.text).join(' ')}))].filter(x=>x.words.toLocaleLowerCase().includes(q));if(!items.length)append(results,empty('Nothing matches.'));items.forEach(x=>append(results,card(x.title,x.kind+' · '+date(x.updatedAt||x.createdAt),null,()=>x.kind==='space'?openSpace(x.id):openObject(x.kind,x.id))))}inp.addEventListener('input',lookup);lookup();inp.focus();}
