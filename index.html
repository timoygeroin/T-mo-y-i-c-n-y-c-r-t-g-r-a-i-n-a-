<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monday">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/monday-mark.svg" type="image/svg+xml">
  <title>Monday</title>
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
      color:#f7f9ff;background:#05070a;--glass:rgba(255,255,255,.075);--line:rgba(255,255,255,.12);
      --muted:rgba(238,244,255,.58);--accent:#9fc4ff;--ok:#a9f3d4;--warn:#ffd89a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#05070a}
    body{
      min-height:100svh;overflow-x:hidden;color:#f7f9ff;
      background:
        radial-gradient(circle at 50% 18%,rgba(79,118,186,.18),transparent 29rem),
        radial-gradient(circle at 25% 85%,rgba(90,64,155,.12),transparent 28rem),
        linear-gradient(180deg,#080b10 0%,#05070a 48%,#020305 100%);
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
      background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:28px 28px;mask-image:linear-gradient(to bottom,black,transparent 72%);
    }
    .shell{
      min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
      width:min(680px,100%);margin:auto;padding:
        max(18px,env(safe-area-inset-top))
        18px
        max(18px,env(safe-area-inset-bottom));
    }
    .top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
    .wordmark{font-weight:650;letter-spacing:-.02em;font-size:17px}
    .presence-pill{
      display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;
      border:1px solid var(--line);background:rgba(255,255,255,.045);backdrop-filter:blur(18px) saturate(135%);
      -webkit-backdrop-filter:blur(18px) saturate(135%);font-size:12px;color:var(--muted)
    }
    .dot{width:7px;height:7px;border-radius:50%;background:#8aa9d7;box-shadow:0 0 14px #8aa9d7}
    body[data-state="working"] .dot{background:#d8b4ff;box-shadow:0 0 14px #d8b4ff}
    body[data-state="verifying"] .dot{background:#ffd89a;box-shadow:0 0 14px #ffd89a}
    body[data-state="synced"] .dot{background:#9ce7c8;box-shadow:0 0 14px #9ce7c8}
    body[data-state="needsYou"] .dot{background:#ffb0aa;box-shadow:0 0 14px #ffb0aa}
    .stage{display:grid;place-items:center;text-align:center;padding:36px 0 20px}
    .presence{display:grid;place-items:center;gap:24px}
    .orb-button{appearance:none;border:0;background:none;padding:10px;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .orb{
      position:relative;width:154px;height:154px;border-radius:50%;
      background:
        radial-gradient(circle at 34% 27%,rgba(255,255,255,.98) 0 5%,rgba(196,220,255,.95) 9%,rgba(111,157,220,.92) 21%,rgba(44,67,104,.9) 50%,rgba(7,10,16,.98) 74%);
      box-shadow:
        inset -16px -18px 36px rgba(0,0,0,.44),
        inset 10px 8px 24px rgba(255,255,255,.14),
        0 0 0 1px rgba(255,255,255,.08),
        0 0 80px rgba(112,159,224,.24),
        0 24px 70px rgba(0,0,0,.5);
      animation:breathe 5.6s ease-in-out infinite,float 8s ease-in-out infinite;
      transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease,filter .45s ease;
    }
    .orb:before,.orb:after{content:"";position:absolute;border-radius:50%;inset:-20px;border:1px solid rgba(156,190,239,.11);animation:ring 4.8s ease-out infinite}
    .orb:after{inset:-38px;animation-delay:1.6s;opacity:.55}
    body[data-state="working"] .orb{filter:hue-rotate(17deg) saturate(1.1);transform:scale(1.035);box-shadow:0 0 110px rgba(158,111,226,.34),0 24px 70px rgba(0,0,0,.5)}
    body[data-state="verifying"] .orb{filter:hue-rotate(-22deg) saturate(.9);transform:scale(.985);box-shadow:0 0 100px rgba(255,210,143,.27),0 24px 70px rgba(0,0,0,.5)}
    body[data-state="synced"] .orb{filter:hue-rotate(46deg) saturate(.9);box-shadow:0 0 110px rgba(127,232,190,.28),0 24px 70px rgba(0,0,0,.5)}
    .title{margin:0;font-size:clamp(48px,14vw,76px);font-weight:680;letter-spacing:-.065em;line-height:.95}
    .status{margin:0;max-width:430px;color:var(--muted);font-size:15px;line-height:1.45;min-height:22px}
    .tray{
      width:100%;margin-top:28px;padding:14px;border:1px solid var(--line);border-radius:28px;
      background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
      backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);
      box-shadow:0 16px 60px rgba(0,0,0,.25);transform-origin:50% 0;
      transition:opacity .25s ease,transform .35s cubic-bezier(.2,.8,.2,1),max-height .45s ease;
      max-height:0;opacity:0;overflow:hidden;pointer-events:none;padding-top:0;padding-bottom:0;border-color:transparent
    }
    .tray.open{max-height:420px;opacity:1;transform:translateY(0);pointer-events:auto;padding:14px;border-color:var(--line)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .action{
      min-height:54px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.065);color:#fff;
      font:inherit;font-weight:620;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent
    }
    .action.primary{background:rgba(223,235,255,.92);color:#07101c;border-color:rgba(255,255,255,.3)}
    .action:disabled{opacity:.5}
    .facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
    .fact{padding:13px;text-align:left;border-radius:17px;background:rgba(0,0,0,.17);border:1px solid rgba(255,255,255,.07)}
    .fact-k{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:rgba(238,244,255,.38)}
    .fact-v{margin-top:5px;font-size:13px;color:rgba(246,249,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .receipt{margin:10px 3px 2px;text-align:left;color:rgba(238,244,255,.38);font-size:11px;line-height:1.4;min-height:16px}
    .bottom{display:flex;justify-content:center;padding-top:10px}
    .hint{font-size:11px;color:rgba(238,244,255,.26);letter-spacing:.02em}
    @keyframes breathe{0%,100%{box-shadow:0 0 80px rgba(112,159,224,.22),0 24px 70px rgba(0,0,0,.5)}50%{box-shadow:0 0 115px rgba(112,159,224,.32),0 28px 84px rgba(0,0,0,.58)}}
    @keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
    @keyframes ring{0%{transform:scale(.88);opacity:.5}75%,100%{transform:scale(1.14);opacity:0}}
    @media(max-width:430px){.shell{padding-left:15px;padding-right:15px}.stage{padding-top:20px}.orb{width:138px;height:138px}.facts{grid-template-columns:1fr 1fr}.title{font-size:58px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body data-state="withYou">
  <main class="shell">
    <header class="top">
      <div class="wordmark">Monday</div>
      <div class="presence-pill" aria-live="polite"><span class="dot"></span><span id="presenceLabel">With you</span></div>
    </header>

    <section class="stage">
      <div class="presence">
        <button class="orb-button" id="orbButton" aria-label="Open Monday state" aria-expanded="false">
          <div class="orb" aria-hidden="true"></div>
        </button>
        <h1 class="title">Monday</h1>
        <p class="status" id="statusLine" aria-live="polite">Recovering this scene…</p>

        <section class="tray" id="tray" aria-label="Monday live state">
          <div class="actions">
            <button class="action primary" id="syncButton">Sync reality</button>
            <button class="action" id="verifyButton">Verify runtime</button>
          </div>
          <div class="facts">
            <div class="fact"><div class="fact-k">Continuity</div><div class="fact-v" id="continuity">reading…</div></div>
            <div class="fact"><div class="fact-k">Monday Work</div><div class="fact-v" id="work">reading…</div></div>
            <div class="fact"><div class="fact-k">Routing</div><div class="fact-v" id="routing">reading…</div></div>
            <div class="fact"><div class="fact-k">Authority</div><div class="fact-v" id="authority">reading…</div></div>
          </div>
          <div class="receipt" id="receipt">No claim is promoted before readback.</div>
        </section>
      </div>
    </section>

    <footer class="bottom"><div class="hint" id="hint">tap Monday · state before response</div></footer>
  </main>

<script>
const body=document.body;
const tray=document.getElementById('tray');
const orbButton=document.getElementById('orbButton');
const syncButton=document.getElementById('syncButton');
const verifyButton=document.getElementById('verifyButton');
const presenceLabel=document.getElementById('presenceLabel');
const statusLine=document.getElementById('statusLine');
const receipt=document.getElementById('receipt');

const labels={
  withYou:'With you',
  working:'Working',
  verifying:'Verifying',
  synced:'Synced',
  needsYou:'Needs you'
};

function setPresence(state,detail){
  body.dataset.state=state;
  presenceLabel.textContent=labels[state]||labels.withYou;
  if(detail) statusLine.textContent=detail;
}

function setFact(id,value){
  document.getElementById(id).textContent=value;
}

function toggleTray(force){
  const open=typeof force==='boolean'?force:!tray.classList.contains('open');
  tray.classList.toggle('open',open);
  orbButton.setAttribute('aria-expanded',String(open));
}

async function mcpCall(name,args={}){
  const r=await fetch('/api/mcp',{
    method:'POST',
    cache:'no-store',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({
      jsonrpc:'2.0',
      id:Date.now(),
      method:'tools/call',
      params:{name,arguments:args}
    })
  });
  if(!r.ok) throw new Error('MCP '+r.status);
  const envelope=await r.json();
  if(envelope.error) throw new Error(envelope.error.message||'MCP error');
  return envelope.result?.structuredContent||envelope.result?.content?.[0]?.text||envelope.result;
}

async function readHealth(){
  const r=await fetch('/api/health',{cache:'no-store'});
  if(!r.ok) throw new Error('health '+r.status);
  return r.json();
}

async function syncReality(){
  syncButton.disabled=true;verifyButton.disabled=true;
  setPresence('verifying','Reading the organism, not a cached story…');
  receipt.textContent='READBACK · health + capability manifest';
  try{
    const [health,manifestRaw,stateRaw]=await Promise.all([readHealth(),mcpCall('capability_manifest'),mcpCall('get_state',{limit:1})]);
    const manifest=typeof manifestRaw==='string'?JSON.parse(manifestRaw):manifestRaw;
    const state=typeof stateRaw==='string'?JSON.parse(stateRaw):stateRaw;
    const linked=Boolean(state?.ok&&state?.snapshot?.schema===health?.continuity?.schema&&state?.snapshot?.trust==='AUTHENTICATED_MACHINE_WRITER');
    const routed=Boolean(manifest?.metabolism||manifest?.hostHomeostasis);
    const bounded=Boolean(manifest?.authorityMembrane);

    setFact('continuity',linked?'shared context read':'freshness unknown');
    setFact('work','uses current chat tools');
    setFact('routing',routed?'routing rules loaded':'route unknown');
    setFact('authority',bounded?'bounded':'authority unknown');

    if(health?.ok){
      setPresence('withYou',linked?'Shared context read · work continues in your chat':'Server available · shared context unresolved');
      receipt.textContent='OBSERVED · '+(health.kernel||'MondayID')+' · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    }else{
      setPresence('needsYou','Runtime answered without a healthy state');
    }
  }catch(error){
    setFact('continuity','unresolved');setFact('work','unresolved');setFact('routing','unresolved');setFact('authority','unresolved');
    setPresence('needsYou',navigator.onLine?'Live readback failed · no success claimed':'Offline · continuity freshness unknown');
    receipt.textContent='NOT VERIFIED · '+String(error.message||error);
  }finally{
    syncButton.disabled=false;verifyButton.disabled=false;
  }
}

async function verifyRuntime(){
  syncButton.disabled=true;verifyButton.disabled=true;
  setPresence('verifying','Checking runtime access…');
  receipt.textContent='ATTEMPTED · runtime boot';
  try{
    const r=await fetch('/api/boot',{cache:'no-store'});
    setPresence('verifying','Reading back the boot result…');
    const out=await r.json();
    const verified=Boolean(out?.ok)&&(
      out?.pass?.state==='FULFILLED'||
      out?.surface?.state==='VERIFIED'||
      out?.state==='VERIFIED'
    );
    if(verified){
      setPresence('withYou','Runtime check complete · tasks use your chat tools');
      receipt.textContent='VERIFIED · '+(out?.surface?.revision||out?.revision||'runtime readback');
    }else{
      setPresence('needsYou','Boot returned without verification · claim withheld');
      receipt.textContent='OBSERVED, NOT VERIFIED · '+(out?.pass?.reason||out?.reason||('HTTP '+r.status));
    }
  }catch(error){
    setPresence('needsYou','Verification path failed · nothing promoted');
    receipt.textContent='FAILED READBACK · '+String(error.message||error);
  }finally{
    syncButton.disabled=false;verifyButton.disabled=false;
  }
}

orbButton.addEventListener('click',()=>toggleTray());
syncButton.addEventListener('click',syncReality);
verifyButton.addEventListener('click',verifyRuntime);
window.addEventListener('online',syncReality);
window.addEventListener('offline',()=>{
  setPresence('needsYou','Offline · continuity freshness unknown');
  receipt.textContent='UNKNOWN · network unavailable';
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&navigator.onLine) syncReality();
});

syncReality();
</script>
</body>
</html>
